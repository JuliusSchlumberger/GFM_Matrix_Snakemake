[project]
name = "GFM"
version = "0.1.0"
description = "Add a short description here"
authors = ["Maarten Pronk <git@evetion.nl>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-64"]
readme = "README.md"
license = "MIT"
license-file = "LICENSE"
homepage = "https://github.com/Deltares-research/GFM/"
documentation = "https://github.com/Deltares-research/GFM/"
repository = "https://github.com/Deltares-research/GFM/"


[tasks]
flood = { cmd = "julia --project=core -e'using Aqueduct;Aqueduct.main(Base.ARGS)'", cwd = ".", depends-on = [
    "initialize-julia",
] }

[feature.dev.tasks]
# Julia
update-manifest-julia = { cmd = "julia --project=core --eval='using Pkg; Pkg.update()'", inputs = [
    "core/Project.toml",
], env = { JULIA_SSL_CA_ROOTS_PATH = "" } }
update-registry-julia = { cmd = "julia --eval='using Pkg; Registry.update()'", inputs = [
    "core/Project.toml",
] }
instantiate-julia = { cmd = "julia --project=core --eval='using Pkg; Pkg.instantiate()'", env = { JULIA_SSL_CA_ROOTS_PATH = "" } }
initialize-julia = { depends-on = [
    "update-registry-julia",
    "instantiate-julia",
] }
instantiate-julia-build = { cmd = "julia --project=build --eval='using Pkg; Pkg.instantiate()'", env = { JULIA_SSL_CA_ROOTS_PATH = "" } }

build = { cmd = "julia --project=build build/build.jl", env = { JULIA_SSL_CA_ROOTS_PATH = "" }, depends-on = [
    "instantiate-julia-build",
    "initialize-julia",
] }

[dependencies]
hydromt = ">=0.9.4,<0.10"
jupyterlab = ">=4.2.1,<4.3"
cdsapi = ">=0.7.0,<0.8"
numpy = ">=1.26.4,<1.27"
matplotlib = ">=3.8.4,<3.9"
xarray = ">=2024.5.0,<2024.6"
netcdf4 = ">=1.6.5,<1.7"
bottleneck = ">=1.3.8,<1.4"
dask = ">=2024.5.1,<2024.6"
cartopy = ">=0.23.0,<0.24"
ipympl = ">=0.9.3"
python = ">=3.11"
rioxarray = ">=0.15.0"
juliaup = "*"
#rasterio = ">=1.3.0"
pyshtools = "*"
boule = "*"

[pypi-dependencies]
#pystac_client = "*"
#planetary_computer = "*"
snakemake = ">=8.0"


[feature.dev.dependencies]
mypy = "*"
ruff = "*"
rust = "*"

#[feature.aqueduct]
#pypi-dependencies = {pystac_client = "*", planetary_computer = "*"}
#

[environments]
dev = { features = ["dev"] }
#valid = {features = ["aqueduct"]}
