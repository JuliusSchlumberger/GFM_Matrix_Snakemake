# GFM (Global Flood Model) runtime environment - snakemake_workflow/ only.
#
# Install with miniforge/mambaforge:
#   mamba env create -f environment.yml
#   conda activate gfm
#
# Update after editing this file:
#   mamba env update -f environment.yml --prune
#
# Pure-Python pipeline - the flood model itself is src/flood_model.py +
# src/eikonal.py (a validated Numba port), no external executable/toolchain
# required. Versions are EXACT pins (2026-08), not ranges - a range-pinned
# first attempt let mamba's solver pick matplotlib=3.8.4/numpy=1.26.4
# (both technically within range), which crashed with a native Windows
# exception (0xc06d007f) inside matplotlib's Bezier/patch rendering
# (tests/river_mouth_tile_validation's plotting). Pinning matplotlib/numpy
# to the exact versions already proven safe elsewhere did NOT fix it, though
# - the real cause was the BLAS backend: this machine's default mamba solve
# picks a newer MKL build (2024.2.2) than the proven-working environments
# (mkl 2023.2.0) use, and that newer MKL build crashes on this CPU for the
# specific numeric path matplotlib's Bezier subdivision hits. `libblas=
# *openblas` below forces OpenBLAS instead of MKL for every BLAS-linked
# package (numpy/scipy/etc.), sidestepping MKL-version/CPU sensitivity
# entirely - confirmed fixed the crash. See snakemake_workflow/memory.md.
# Mirrors pixi.toml; keep the two in sync.
#
# (Replaces a stale, unrelated `name: hydromt-sfincs` environment.yml that
# was left at this path from an earlier, different setup attempt - 2026-08.)
name: gfm
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.13
  - libblas=*=*openblas          # forces OpenBLAS over MKL - see note above
  - hydromt=0.9.3
  - numpy=1.26.2
  - matplotlib=3.8.2
  - xarray=2023.11.0
  - netcdf4=1.6.5                 # xarray's NetCDF read/write backend - no direct import
  - geopandas=0.14.1
  - rasterio=1.3.9
  - rioxarray=0.15.0
  - shapely=2.0.2
  - fiona=1.9.5                   # geopandas backend + fiona.errors used directly (config_utils.retry_transient_io)
  - pyogrio=0.7.2                 # geopandas' default vector I/O backend
  - scikit-learn=1.3.2            # sklearn.neighbors.BallTree (IDW boundary seeding)
  - numba=0.58.1                  # JIT for the eikonal solver (src/eikonal.py)
  - pandas=2.1.3
  - scipy=1.11.4
  - pyyaml=6.0.1
  - pillow=10.2.0
  - gdal=3.8.3                    # osgeo.gdal - VRT mosaicking (build_mosaic_vrt.py, sync_deltadtm.py)
  - pyshtools=4.14.1              # EGM2008/GOCO06s spherical-harmonic geoid synthesis (src/vertical_datum.py)
  - boule=0.6.0                   # ellipsoid definitions for pyshtools' geoid() call
  - requests=2.31.0               # sync_deltadtm.py downloads
  - affine=2.4.0
  - openpyxl=3.1.2                # pandas ExcelWriter engine (tests/build_calibration_report_xlsx.py)
  - tomli=2.0.1                   # TOML fallback for Python <3.11 (no stdlib tomllib) - calibration scripts
  - pip
  - pip:
      # Matches the Snakefile's own min_version("7.0") - NOT >=8.0 (untested
      # against this codebase; snakemake 8's plugin architecture is a real
      # breaking change from 7.x, not just a version bump).
      - snakemake==7.32.4

# Optional dev tools (lint/type-check, not needed to run the pipeline):
#   mamba install -n gfm ruff mypy
