# England local-input validation: real EA LIDAR DEM + EA design sea levels, both kept in
# their native ODN datum (native_datum=native, data_catalog_local_input.yml - TODO.md: no
# GOCO06s bridge, confirmed unnecessary since both legs already share a datum), over a fine,
# overlapping tile grid built from EA's own 5km tiles over all of England
# (preparation/build_england_fine_tiles.py without --production-tile-id: 1836 tiles, hop 0-13)
# - production's own tile_grid is sized for 30m data and is infeasible at England's native 1m
# resolution (TODO.md). Diffed against england_global_input.yml, which uses the exact same
# tile_grid.path (TODO.md D5). Outputs sit under all_england/: the Isles of Scilly test grid's
# outputs directly under {root}/england_local_input/ reuse tile_ids 0-14 for other tiles.
# Scenario override layer on config.yml + config_local.yml (config_utils.materialize_config).

# Two-component SLR propagation adds the static level MDT + 2020 offset (boundaries.static_station_levels)
# in the GOCO06s frame to this ODN scenario's sea; it is kept, so a systematic overestimation here
# may come from that offset between the two datums (TODO.md).

tile_grid:
  path: "{processed_inputs_dir}/mask/validation/england_fine_tiles_all_england.gpkg"

paths:
  hydromt_data_catalog:
    - "snakemake_workflow/config/data_catalog_gfm.yml"
    - "snakemake_workflow/config/data_catalog_local_input.yml"

boundary_conditions:
  # Present-day only (TODO.md D4): EA's design sea levels have no SLR scenario.
  # Only what the benchmarks score: RP100 and RP250 bracket the ~RP200 flood zones
  # (data_catalog_validation.yml comparison_return_periods), present day.
  return_periods: [100, 250]
  waterlevel_names: ["SLR_0"]
  # Isolated from the shared global COAST-RP cache (preprocessing.smk's default
  # {processed_inputs_dir}/WL_scenarios_cache) - this scenario's SLR_0 cache holds
  # EA-derived, ODN->GOCO06s-bridged stations instead, pre-written by
  # preparation/cache_local_waterlevel_stations.py at exactly the path
  # cache_waterlevel_stations would otherwise produce. Sharing the default
  # directory would corrupt the real global SLR_0 cache every other scenario reads.
  stations_cache_dir: "{root}/england_local_input/processed_inputs/WL_scenarios_cache"
  stations_cache_prebuilt: true  # preparation/cache_local_waterlevel_stations.py

adaptation:
  # WATERLEVEL_NAMES (Snakefile) is the UNION of boundary_conditions.waterlevel_names
  # and adaptation.slr_intensities - must also be restricted to SLR_0, or production's
  # default SLR_500/SLR_1000 adaptation levels leak back in with no local cache for them.
  slr_intensities: []

simulation:
  dem_source_manifest: "{processed_inputs_dir}/mask/validation/england_fine_dem_source_manifest_all_england.csv"
  model_outputs: "{root}/england_local_input/all_england/model_outputs"
  preprocessing_inputs_dir: null  # own per-tile inputs under model_outputs
postprocessing:
  merge_only: true  # validation run: the HPC postprocess chain merges only, no exposure / flood totals
  merged_outputs: "{root}/england_local_input/all_england/merged_results"
  # 20 km chunks at 1 m (~25 tiles, 4e8 cells each), packed over 16 one-core jobs per event.
  native_chunk_m: 20000
  native_merge_jobs: 16
visualization:
  output_dir: "{root}/england_local_input/all_england/figures"
validation:
  # Isolated from the shared default ({root}/validation) for the same reason as
  # boundary_conditions.stations_cache_dir above - england_global_input's own metrics CSVs
  # would otherwise collide with these at the exact same filename (standalone_metrics_path
  # does not key by scenario, only by benchmark/RP/SLR).
  output_dir: "{root}/england_local_input/all_england/validation"
  # hpc/gfm_hpc.py validate: per group, scripts run in order with {config} = this scenario's
  # HPC-view config and {config:NAME} = scenario NAME's; {variant} is "" here and "__<variant>" in
  # a flood-model variant's config (flood_variants.variant_config), after each output root it moves.
  runs:
    scores:
      - ["validation/rescore_floodzone3_local.py", "--config", "{config}"]
      - ["validation/rescore_1km_fp_buffer_local.py", "--config", "{config}"]
    agreement_map:
      - ["validation/plot_local_vs_global_agreement.py", "--local-config", "{config}",
         "--global-config", "{config:england_global_input{variant}}", "--return-period", "RP100",
         "--bbox", "-0.1717", "52.5678", "0.2529", "53.0819",
         "--out", "{root}/england_local_input/all_england/validation{variant}/agreement_wash_RP100.png"]
    # Local vs global input, area- and population-weighted, England and Wales.
    exposure_table:
      - ["validation/exposure_validation_report.py", "--out-dir", "{root}/local_vs_global_exposure{variant}",
         "--local-vs-global", "england", "{root}/england_local_input/all_england/validation{variant}",
         "{root}/england_global_input/all_england/validation{variant}",
         "--local-vs-global", "wales", "{root}/wales_local_input/all_wales/validation{variant}",
         "{root}/wales_global_input/validation{variant}"]
hpc:
  jobs_dir: "{root}/england_local_input/all_england/model_outputs/hpc_jobs"
  n_nodes: 32  # preprocess: 32 x 4 cores of the plan's 144
  # 1 m fine tiles: ~20 s per solve in earlier runs, x6 margin for the solver caps.
  wave_packing: {solve_minutes: 2.0, target_hours: 2.0, profile: simulate_packed}
