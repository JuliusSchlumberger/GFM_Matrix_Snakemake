# HPC site values, worked example for Hydrax (Deltares). Copy to config_hpc.yml (gitignored)
# and fill in your site values. Required by the HPC job generators, which layer it over
# config.yml (+ config_local.yml) via config_utils.load_hpc_config(): it gives the paths as the
# compute nodes see them and the cluster's SLURM values. Only keys to override.

paths:
  # Linux mount of the shared data root; equal to GFM_DATA_ROOT in sfincs_tiles/site_env.sh.
  root: "/p/11212688-004-global-floodmaps/modelling"
  # Linux repo checkout the jobs `cd` into; equal to GFM_CODE_ROOT in sfincs_tiles/site_env.sh.
  # Absolute, no `~`: it is embedded as `cd "{code_root}"`, where bash does not expand `~`.
  code_root: "/u/schlumbe/gfm_code"

hpc:
  sbatch:
    # Hydrax partitions: 1vcpu/4vcpu/16vcpu/24vcpu/60vcpu (8 GB/vCPU), 44vcpu, gpu, test (30 min cap).
    # Responsible use: ~240 cores at once, so n_nodes x cpus_per_task per wave should stay under that.
    partition: 1vcpu
    # 1vcpu nodes have 7950 MB usable, not 8192; requesting 8G fails.
    mem: "7G"
    # HDF5_USE_FILE_LOCKING=FALSE: HDF5 reads (e.g. geogunit .nc) hang on Hydrax NFS otherwise.
    env_activate_cmd: 'module load miniconda && eval "$(conda shell.bash hook)" && conda activate gfm && export HDF5_USE_FILE_LOCKING=FALSE'

  # Sized for ~0.6 min/solve and the 4504-tile grid (hop 0: 3761 tiles, hop 1/2: 462+139);
  # re-estimate before reusing for another grid or solver change. Semantics: config.yml.
  wave_tiers:
    - hops: [0]
      n_nodes: 6
      partition: "24vcpu"
      cpus_per_task: 24
      mem: "168G"           # 7G/vcpu, same headroom ratio as sbatch: above
      time: "0-16:00:00"    # ~12h worst case (627 tiles/batch x 45 scenarios / 24-way / ~0.6min) + margin
    - hops: [1, 2]
      n_nodes: 2
      partition: "24vcpu"
      cpus_per_task: 24
      mem: "168G"
      time: "0-04:00:00"    # ~4.4h worst case (hop=1 batches), little margin
    - hops: null
      n_nodes: null         # one 1vcpu node per tile
      partition: "1vcpu"
      cpus_per_task: 1
      mem: "7G"
      time: "0-01:00:00"    # ~27min worst case (45 scenarios serial, ~0.6min each) + margin

  # SFINCS calibration jobs: 4 threads per SFINCS run (sfincs_min_per_mcell is calibrated at 4).
  calibration_sbatch:
    partition: "4vcpu"
    cpus_per_task: 4
    mem: "30G"
  # Flood totals + plots: one node, I/O-bound thread pool of cpus_per_task workers.
  flood_totals_sbatch:
    partition: "24vcpu"
    cpus_per_task: 24
    # A guess at the partition's safe ceiling; confirm with `sinfo -N -o "%N %P %m %c"`.
    mem: "32G"
