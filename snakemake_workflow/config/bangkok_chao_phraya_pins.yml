# Values the existing bangkok_chao_phraya outputs were computed with; merged after bangkok_chao_phraya.yml by materialize_configs.py. Delete a key to follow config.yml (then re-run).
adaptation:
  slr_intensities: [SLR_500, SLR_1000, SLR_1500]
analysis: {plot_timeseries: true}
population_growth:
  output_years: [2025, 2030, 2035, 2040, 2045, 2050, 2060, 2075, 2100]
simulation:
  flooding: {friction_scale_factor: 0.3}  # computed with effective 9.0 = 0.3 x 30 (config.yml: 0.4 x 30 = 12.0)
visualization:
  growth_rates: {max: 1.5, min: -0.5}
  slr_interp: {max_mm: 1500, n_points: 100}
