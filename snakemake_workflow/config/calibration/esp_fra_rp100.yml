# Group scenario for the ESP/FRA/NOR HPC calibration sweep
# (docs/calibration_sweep_plan.md) - Spain + France, simulated at RP100
# (matches both countries' real benchmark hazard maps). Layered on top of
# config.yml + config_local.yml via src/config_utils.py::materialize_config
# (see scripts/calibration/build_run_config.py), then further layered with
# one sweep-point parameter delta (config/calibration/sweep/*.yml).
#
# tile_grid.path points at the real closure GeoPackage written by
# scripts/calibration/select_country_tiles.py (78 tiles: 77 hop_distance=0,
# 1 hop_distance=1 - run for real 2026-09, zero tiles pulled in as pure
# dependency beyond the benchmark-region core).

tile_grid:
  path: "{processed_inputs_dir}/mask/calibration/esp_fra_tiles.gpkg"

boundary_conditions:
  return_periods: [100]
  slr_scenarios: ["SLR_0"]

# REQUIRED, not decorative - merged_slr_scenarios() unions this with
# boundary_conditions.slr_scenarios; leaving it unset would silently pull in
# config.yml's own SLR_500 intensity, against the "single baseline SLR_0,
# no SLR sweep" decision.
adaptation:
  slr_intensities: []

validation:
  return_period: "RP100"
  waterlevel_name: "SLR_0"

# Small closure (78 tiles total, one wave of 77 + one wave of 1). The
# production default of 20 would over-fragment into ~1-tile-per-node
# batches for the hop=1 wave, wasting SLURM job overhead for no
# parallelism benefit at that scale - but the sweep runs one combination
# at a time (run_calibration_sweep.sh), so there's no reason to stay as
# low as 3 either: bumped to speed up each combination's own wall time
# (2026-09-14, well under Hydrax's ~240-core responsible-use ceiling -
# see config.yml's hpc.sbatch comment - even accounting for
# large_tile_batch_multiplier on the 11 large tiles). Only affects
# SIMULATION-wave batching now - single_preprocess_job (below) takes
# preprocessing itself out of n_nodes's control entirely.
hpc:
  n_nodes: 10
  # 2026-09-14: collapse ALL preprocessing (both size classes) into ONE
  # 1vcpu job instead of splitting across nodes - see
  # generate_hpc_preprocess_job.py's own comment on this flag for the full
  # rationale/risk (real preprocessing compute time is minutes at this
  # scale; SLURM queue wait per separately-submitted job was, at times,
  # HOURS - one job means one queue ticket instead of several).
  single_preprocess_job: true
  # 2026-09-14: production's 24h default (config.yml's hpc.sbatch.time) badly
  # mismatches calibration-scale preprocessing - SLURM's backfill scheduler
  # favors jobs it can slot into small gaps without delaying higher-priority
  # work, so requesting a full day when the job needs far less actively hurts
  # queue placement (confirmed live: `squeue --start` showed the estimated
  # start time getting WORSE, not better, between two checks minutes apart).
  # 6h (user-chosen, 2026-09-14) accounts for single_preprocess_job (above)
  # now running all 78 tiles' DEM/mask/friction/boundaries SERIALLY on one
  # 1vcpu core instead of split across nodes - real parallel runs earlier
  # today finished in ~15 minutes across ~10 nodes, so serial is naturally
  # much slower, but still nowhere near the production 24h default.
  sbatch:
    time: "06:00:00"
