# Machine-local configuration overrides for GFM.
#
# Copy this file to config_local.yml (git-ignored) and fill in the values
# for your machine.  Only include the keys you need to override — everything
# else is inherited from config.yml.
#
# The Snakefile loads this file automatically if it exists:
#   snakemake_workflow/config/config_local.yml
#
# Usage:
#   cp snakemake_workflow/config/config_local.yml.example \
#      snakemake_workflow/config/config_local.yml
#   # then edit config_local.yml

paths:
  # Root directory for all project data and model outputs (D:/GFM on the
  # primary machine).  Every path in config.yml that contains {root} resolves
  # to this value.
  root: "P:/11212688-004-global-floodmaps/modelling"         # ← change to your local path

  # Root of the repository clone.
  code_root: "C:/Users/schlumbe/GFM_Matrix_Snakemake"   # ← change to your local path

  # Root of the Aqueduct build tree (where aqueduct.exe lives). Only set this
  # if the Aqueduct build lives somewhere other than code_root on this
  # machine (e.g. a separate build directory or drive) - it defaults to
  # code_root if omitted.
  aqueduct_root: "C:/Users/schlumbe/GFM"   # ← uncomment and change if needed

# NO tile_grid override here (2026-08-09, corrected): config.yml's own
# tile_grid.path ({processed_inputs_dir}/mask/domain_tiles_global.gpkg) is
# already correct - it's the real output of the 2026-08 fixed-tile-chunking
# redesign (2578 chunks, confirmed against processed_inputs/mask/
# domain_tiles_global.gpkg's actual feature count + hop_distance column).
# An earlier version of this file overrode it back to the legacy
# {root}/inputs/mask/domain_tiles_globally.gpkg (1428 tiles, last written
# 2026-07-21) - that override was added right after the 2026-07-30 pull of
# c6d5cad "flood model now in python", when config.yml's tile_grid.path
# briefly pointed at a stale Western-Europe-only grid; config.yml has since
# moved on to the correct global path, but this override kept silently
# shadowing it with the OLD legacy file the whole time - confirmed directly
# by comparing feature counts (1428 vs the real 2578) and the debug
# checkpoint 13_chunks_ordered.gpkg's own write timing (build_tile_manifest.
# py:452-477 - the checkpoint and the real output are written from the same
# `final` GeoDataFrame in the same run, so the mismatch could only mean this
# override was pointing somewhere the pipeline itself never wrote to).