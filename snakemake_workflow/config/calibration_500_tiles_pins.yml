# Values the existing calibration_500_tiles outputs were computed with; merged after calibration_500_tiles.yml by materialize_configs.py. Delete a key to follow config.yml (then re-run).
analysis: {plot_timeseries: true}
population_growth:
  output_years: [2025, 2030, 2035, 2040, 2045, 2050, 2060, 2075, 2100]
simulation:
  flooding:  # computed with fsf 30.0, attenuated SLR propagation and no duration correction
    friction_scale_factor: 30.0
    slr_propagation: attenuated
    duration_correction: {enabled: false}
    knn: 15  # COAST-RP seeds over the 15 nearest stations, inverse-distance squared
    idw_power: 2
visualization:
  growth_rates: {max: 1.5, min: -0.5}
  slr_interp: {max_mm: 1500, n_points: 100}
boundary_conditions:  # computed with COAST-RP levels and COAST-HG hydrographs
  storm_tide_source: coast_rp
