# Values pinned for the `calibration_500_tiles` scenario (2026-10-18): what its existing outputs were
# computed with, before config.yml's defaults moved on. Merged by
# snakemake_workflow/scripts/materialize_configs.py AFTER calibration_500_tiles.yml.
# Delete a key here to let the scenario follow config.yml again (then re-run it).
analysis: {plot_timeseries: true}
population_growth:
  output_years: [2025, 2030, 2035, 2040, 2045, 2050, 2060, 2075, 2100]
simulation:
  flooding: {friction_scale_factor: 30.0}  # the value its existing outputs were computed with (production config.yml: 12.0)
visualization:
  growth_rates: {max: 1.5, min: -0.5}
  slr_interp: {max_mm: 1500, n_points: 100}
