# GFM input data catalog. Relative `path:` entries are resolved against
# config["paths"]["root"], passed explicitly by src/config_utils.get_data_catalog.
#
# Every entry's `meta` carries: category, description, source_author, source_url,
# source_version, source_license, source_access and, where one exists, paper_ref / paper_doi.

coast_rp:
  data_type: GeoDataset
  driver: netcdf
  path: inputs/COAST-RP_dataset/COAST-RP.nc
  crs: 4326
  filesystem: local
  rename:
    stations: index
    station_x_coordinate: lon
    station_y_coordinate: lat
  meta:
    category: ocean
    description: >
      COAST-RP: extreme total water levels (storm surge + tide) at ~23,000 GTSM
      coastal output stations for return periods 1, 2, 5, 10, 25, 50, 100, 250,
      500 and 1000 years. Extratropical surges from GTSMv3 (D-Flow FM) forced by
      ERA5 (1979-2018); tropical-cyclone surges from STORM synthetic tracks
      (10,000 years, present climate); combined probabilistically with tides.
      Stations south of -60 deg are dropped (~22,670 remain). Base storm-tide
      forcing in prepare_boundary_conditions.py, with AR6 SLR fingerprints
      (ipcc_ar6_slr_projections) added on top.
    vertical_reference: Local mean sea level at source. Converted to the GOCO06s
      geoid by ADDING the MDT (H_GOCO06s = H_MSL + MDT, mdt_cnes_cls22), so forcing
      and the geoid-corrected DEM (deltadtm) share one vertical reference.
    source_author: J.C.M. Dullaart et al., IVM - Vrije Universiteit Amsterdam
    source_url: https://doi.org/10.4121/uuid:210b66a1-9c82-4e0b-9f4a-8eb15deebb44
    source_access: open download
    source_version: "1.0"
    source_license: CC-BY-4.0
    model_version: Deltares D-Flow FM v1.2.63.64757
    paper_ref: Dullaart et al. (2021), Accounting for tropical cyclones more than
      doubles the global population exposed to low-probability coastal flooding,
      Commun. Earth Environ. 2, 135.
    paper_doi: 10.1038/s43247-021-00204-9

coast_hg:
  data_type: GeoDataset
  driver: netcdf
  path: inputs/COAST_HG/COAST-HG_RP100.nc
  crs: 4326
  filesystem: local
  rename:
    stations: index
    station_x_coordinate: lon
    station_y_coordinate: lat
  meta:
    category: ocean
    description: >
      COAST-HG: RP100 storm-tide hydrographs (full time series, not only the peak)
      at the GTSM stations of coast_rp, from the HGRAPHER method. 23,226 stations,
      894 time steps at 10 min (~6.2 days). Two variables:
      hydrograph_average_tide_signal and hydrograph_spring_tide_signal (same RP100
      surge, two tidal phases); water level in m. Forcing shape for the SFINCS
      tiles (sfincs_tiles/build_line_forcing.py).
    vertical_reference: Local mean sea level (no MDT). build_line_forcing shifts
      each hydrograph by boundary_value - hydrograph_max, using the MDT-corrected
      coast_rp RP100 level, so only the shape is taken from COAST-HG.
    known_caveats: >
      (1) RP100 only: one hydrograph shape per station, no return-period axis.
      (2) The time axis starts at an arbitrary 2000-01-01; only elapsed time is
      meaningful. (3) Rows are not aligned with coast_rp's station rows; stations
      are matched by distance (build_line_forcing.MAX_MATCH_DIST_DEG), not by index.
    source_author: J.C.M. Dullaart, S. Muis, D. Eilander, J.C.J.H. Aerts, H. de Moel,
      P.J. Ward - IVM, Vrije Universiteit Amsterdam
    source_url: https://doi.org/10.4121/21270948.v2
    source_access: open download
    source_version: "2 (4TU.ResearchData, 2023-05-22)"
    source_license: CC-BY-4.0
    paper_ref: Dullaart et al. (2023), Enabling dynamic modelling of coastal flooding
      by defining storm tide hydrographs, Nat. Hazards Earth Syst. Sci. 23, 1847-1862.
    paper_doi: 10.5194/nhess-23-1847-2023

ipcc_ar6_slr_projections:
  data_type: GeoDataset
  driver: netcdf
  # Directory root: files are {confidence}_confidence/{scenario}/total_{scenario}_{confidence}_confidence_values.nc
  path: inputs/SLR/ar6-regional-confidence/regional/confidence_output_files
  crs: 4326
  filesystem: local
  meta:
    category: ocean
    description: >
      IPCC AR6 regional sea-level projections (FACTS), from ar6-regional-confidence.zip:
      quantiles of sea-level change (mm, relative to 1995-2014) at tide gauges and
      on a 1x1 deg grid, per SSP and decade to 2150. prepare_boundary_conditions.py
      derives the spatial SLR fingerprints added to COAST-RP levels.
    source_author: G.G. Garner, T. Hermans, R.E. Kopp, A.B.A. Slangen et al. / IPCC AR6 WG1
    source_url: https://zenodo.org/records/5914710
    source_access: open download
    source_version: "20210809"
    source_license: CC-BY-4.0
    paper_ref: Garner et al. (2021), IPCC AR6 Sea Level Projections, Version 20210809;
      Fox-Kemper et al. (2021), Ocean, Cryosphere and Sea Level Change, IPCC AR6 WG1 Ch. 9.
    paper_doi: 10.5281/zenodo.5914709

ipcc_ar6_slr_wg1_csv:
  data_type: DataFrame
  driver: csv
  # Directory root: analysis/extract_slr_trajectories.py reads SLR_{code}_wg1.csv
  # per code (visualization.ssp_rcp_codes) with pandas; data_type/driver only
  # satisfy the catalog parser.
  path: inputs/SLR
  filesystem: local
  meta:
    category: ocean
    description: >
      Global-mean sea-level-rise trajectories, one CSV per SSP/RCP code
      (SLR_{code}_wg1.csv), year-indexed with p17/p50/p83 columns in metres,
      taken from the global projections of the same AR6 record (ar6.zip) as
      ipcc_ar6_slr_projections. Feeds visualization.slr_trajectories_csv via
      analysis/extract_slr_trajectories.py.
    source_author: G.G. Garner, T. Hermans, R.E. Kopp, A.B.A. Slangen et al. / IPCC AR6 WG1
    source_url: https://zenodo.org/records/5914710
    source_access: open download
    source_version: "20210809"
    source_license: CC-BY-4.0
    paper_ref: Garner et al. (2021), IPCC AR6 Sea Level Projections, Version 20210809.
    paper_doi: 10.5281/zenodo.5914709

deltadtm:
  data_type: RasterDataset
  driver: raster
  path: inputs/DeltaDTM/deltadtm.vrt
  crs: 4326
  filesystem: local
  nodata: -9999
  meta:
    category: topography
    description: >
      DeltaDTM: global coastal digital terrain model (ICESat-2 + TanDEM-X/SRTM,
      vegetation and building bias removed), ~1 arcsec (~30 m), as a VRT over the
      DeltaDTM_v1_1_*.tif tiles (preparation/sync_deltadtm.py). extract_dem.py
      applies the EGM2008 -> GOCO06s geoid correction (src/vertical_datum.py).
    vertical_reference: EGM2008 geoid at source; corrected to GOCO06s before use.
    pixel_size_arcsec: 1
    nodata_value: -9999
    source_author: M. Pronk et al., Deltares / TU Delft
    source_url: https://doi.org/10.4121/21997565
    source_access: open download
    source_version: v1.1
    source_license: CC-BY-4.0
    paper_ref: Pronk et al. (2024), DeltaDTM - a global coastal digital terrain model,
      Earth Syst. Sci. Data 16, 2343-2360.
    paper_doi: 10.5194/essd-16-2343-2024

deltadtm_mask:
  data_type: RasterDataset
  driver: raster
  path: inputs/DeltaDTM_masks/deltadtm_mask.vrt
  crs: 4326
  filesystem: local
  nodata: 255
  meta:
    category: topography
    description: >
      DeltaDTM land/water classification on the DeltaDTM grid (mask_tiles.zip of
      the DeltaDTM release): 0 = land (DEM valid), 1 = ocean, 2 = lake, 3 = river,
      255 = outside DeltaDTM coverage. Restricts each tile's flood domain
      (tile_generation.ocean_code / river_code) and is the default permanent-water
      mask for validation (validation.permanent_water_source).
    pixel_size_arcsec: 1 in y; 1-5 in x, coarsening with latitude (preparation/build_deltadtm_vrt.py)
    nodata_value: 255
    source_author: M. Pronk et al., Deltares / TU Delft
    source_url: https://doi.org/10.4121/21997565
    source_access: open download
    source_version: v1.1
    source_license: CC-BY-4.0
    paper_ref: Pronk et al. (2024), DeltaDTM - a global coastal digital terrain model,
      Earth Syst. Sci. Data 16, 2343-2360.
    paper_doi: 10.5194/essd-16-2343-2024

gebco:
  data_type: RasterDataset
  driver: raster
  path: inputs/gebco_2026_geotiff/gebco.vrt
  crs: 4326
  filesystem: local
  nodata: -32767
  meta:
    category: topography
    description: >
      GEBCO_2026 Grid: global bathymetry and land topography on a 15 arcsec grid,
      int16 m, positive up. Used by extract_dem.py (offshore reclassification and
      DeltaDTM coverage gaps) and by the SFINCS tiles (sfincs_tiles/build_elevation.py)
      for depth below sea level. One VRT over 8 quadrant GeoTIFFs
      (sfincs_tiles/build_gebco_vrt.py).
    vertical_reference: Mean sea level as distributed; sfincs_tiles adds the MDT
      (same convention as coast_rp) before merging with DeltaDTM.
    known_caveats: >
      GEBCO gives no vertical accuracy and no single datum (sources assumed to be
      MSL); nearshore and intertidal areas are the least reliable.
    pixel_size_arcsec: 15
    nodata_value: -32767
    source_author: GEBCO Bathymetric Compilation Group 2026 / Nippon Foundation-GEBCO Seabed 2030
    source_url: https://www.gebco.net/data-products-gridded-bathymetry-data/gebco2026-grid
    source_access: open download
    source_version: "2026"
    source_license: Public domain, attribution required, no implied endorsement
      (GEBCO Grid terms of use)
    paper_ref: GEBCO Bathymetric Compilation Group 2026 (2026), The GEBCO_2026 Grid - a
      continuous terrain model for oceans and land at 15 arc-second intervals, NERC EDS
      British Oceanographic Data Centre NOC.
    paper_doi: 10.5285/4f68d5c7-45eb-f999-e063-7086abc036fa

land_polygons:
  data_type: GeoDataFrame
  driver: vector
  path: inputs/OSM_land/land_polygons.shp
  crs: 4326
  filesystem: local
  meta:
    category: geography
    description: >
      OpenStreetMap land polygons ("land-polygons-split", 873,381 features).
      preparation/fix_ocean_mask_with_osm_land.py uses them to recode DeltaDTM mask
      cells coded as ocean that lie inside an OSM land polygon (inland water such as
      wide river confluences, aquaculture ponds and thermokarst lakes).
    source_author: OpenStreetMap contributors
    source_url: https://osmdata.openstreetmap.de/data/land-polygons.html
    source_access: open download
    source_version: "2026-10-04"
    source_license: ODbL-1.0

land_use:
  data_type: RasterDataset
  driver: raster
  path: inputs/Copernicus/Copernicus_LandUse.tif
  crs: 4326
  filesystem: local
  nodata: 255
  meta:
    category: land_use
    description: >
      Copernicus Global Land Service Land Cover 100 m (LC100), Collection 3, epoch
      2019 discrete classification (PROBA-V, 2017-04 to 2020-03), 23 classes;
      coverage -60 to 80 deg N. Mapped to Manning's n via lu_to_roughness_lookup.
      Not ESA WorldCover.
    pixel_size_m: 100
    nodata_value: 255
    source_author: M. Buchhorn et al., VITO NV
    source_url: https://doi.org/10.5281/zenodo.3939050
    source_access: open download
    source_version: v3.0.1
    source_license: Copernicus Global Land Service data policy (free and open, attribution
      "Copernicus Service information 2020")
    paper_ref: Buchhorn et al. (2020), Copernicus Global Land Cover Layers - Collection 2,
      Remote Sensing 12(6), 1044.
    paper_doi: 10.3390/rs12061044

geogunit_protection_units:
  data_type: RasterDataset
  driver: netcdf
  path: inputs/WRI/geogunit_107_all.nc
  crs: 4326
  filesystem: local
  meta:
    category: socioeconomic
    description: >
      WRI Aqueduct Floods sub-national geographic unit IDs (geogunit_107), ~30 arcsec,
      variable "Geogunits", fill -9999. Assigns each cell a FLOPROS protection
      standard (flopros_protection_standards) and masks benchmark territories in
      validation (geogunit_ids).
    source_author: WRI Aqueduct Floods
    source_url: https://www.wri.org/aqueduct
    source_access: open download
    source_version: Aqueduct Floods (2020)
    source_license: CC-BY-4.0 (WRI open data, attribution to WRI)
    paper_ref: Ward et al. (2020), Aqueduct Floods Methodology, World Resources Institute
      Technical Note.

geogunit_country_units:
  data_type: RasterDataset
  driver: netcdf
  path: inputs/WRI/geogunit_109_all.nc
  crs: 4326
  filesystem: local
  meta:
    category: socioeconomic
    description: >
      WRI Aqueduct Floods country-level unit IDs (geogunit_109), same grid as
      geogunit_107. Aggregates exposure to countries for the world maps.
    source_author: WRI Aqueduct Floods
    source_url: https://www.wri.org/aqueduct
    source_access: open download
    source_version: Aqueduct Floods (2020)
    source_license: CC-BY-4.0 (WRI open data, attribution to WRI)
    paper_ref: Ward et al. (2020), Aqueduct Floods Methodology, World Resources Institute
      Technical Note.

flopros_protection_standards:
  data_type: DataFrame
  driver: xlsx
  driver_kwargs:
    index_col: 0
    header: 0
  # Index "FID_Aque" = geogunit_107 ID; columns "ISO", "Riverine", "Coastal" (years).
  path: inputs/protection_levels/FLOPROS_NL_geogunit_107.xlsx
  filesystem: local
  meta:
    category: socioeconomic
    description: >
      FLOPROS flood protection standards per geogunit_107 unit, as design return
      periods (years), with the coastal standards of Tiggeloven et al. (2020).
      The exposure analysis uses "Coastal"; the delta and protection-column scripts
      fall back to "Riverine" where "Coastal" is missing.
    source_author: P. Scussolini et al. (FLOPROS); T. Tiggeloven et al. (coastal update)
    source_url: https://doi.org/10.5194/nhess-20-1025-2020
    source_access: open download
    source_version: FLOPROS with coastal standards of Tiggeloven et al. (2020)
    source_license: CC-BY-4.0 (published with the papers)
    paper_ref: Scussolini et al. (2016), FLOPROS - an evolving global database of flood
      protection standards, Nat. Hazards Earth Syst. Sci. 16, 1049-1061; Tiggeloven et al.
      (2020), Global-scale benefit-cost analysis of coastal flood adaptation to different
      flood risk drivers using structural measures, Nat. Hazards Earth Syst. Sci. 20, 1025-1044.
    paper_doi: 10.5194/nhess-16-1049-2016; 10.5194/nhess-20-1025-2020

ssp_population_growth_factors:
  data_type: DataFrame
  driver: xlsx
  driver_kwargs:
    sheet_name: "SSP_scenarios"
    header: 1
  # src/population_growth.load_ssp_growth_factors divides population per (scenario,
  # region, year) in 'SSP_scenarios' by the 2020 value in 'historical_data_SSP'. The
  # 'growth_factors' / 'relevant_list' sheets are not used: their lookup copied SSP1
  # into every SSP.
  path: inputs/SSPs/getting_SSP_population_growth_factors.xlsx
  filesystem: local
  meta:
    category: socioeconomic
    description: >
      SSP1-SSP5 population projections per country (million, 5-year steps
      2020-2100, 201 countries), model "IIASA-WiC POP 2025", exported from the SSP
      Scenario Explorer. Growth factors are relative to 2020.
    source_author: IIASA / Wittgenstein Centre for Demography and Global Human Capital
    source_url: https://ssp.apps.ece.iiasa.ac.at/
    source_access: free registration (IIASA SSP Scenario Explorer)
    source_version: IIASA-WiC POP 2025 (SSP update 2024/2025)
    source_license: SSP database licence (CC-BY-4.0-based; cite and link the database
      instead of redistributing substantial parts)
    paper_ref: K.C. et al. (2024), Updating the Shared Socioeconomic Pathways (SSPs) Global
      Population and Human Capital Projections, IIASA Working Paper WP-24-003.
    paper_doi: https://pure.iiasa.ac.at/19487

population:
  data_type: RasterDataset
  driver: raster
  # A count per cell, not a density: do not nearest/bilinear-resample onto a finer
  # grid (inflates totals), see src/exposure_grid.py.
  path: inputs/exposure/global_pop_2020_CN_1km_R2025A_UA_v1.tif
  crs: 4326
  filesystem: local
  nodata: -99999
  meta:
    category: socioeconomic
    description: >
      WorldPop global population count for 2020, 30 arcsec (~1 km), lat -60 to 84;
      only settled cells carry a value. Exposure input (src/exposure_grid.py).
    nodata_value: -99999
    source_author: M. Bondarenko, R. Priyatikanto, N. Tejedor-Garavito et al., WorldPop,
      University of Southampton
    source_url: https://hub.worldpop.org/doi/10.5258/SOTON/WP00845
    source_access: open download
    source_version: R2025A v1
    source_license: CC-BY-4.0
    paper_ref: Bondarenko et al. (2025), The spatial distribution of population in
      2015-2030 at a resolution of 30 arc (approximately 1km at the equator), R2025A v1,
      WorldPop, University of Southampton.
    paper_doi: 10.5258/SOTON/WP00845

lu_to_roughness_lookup:
  data_type: DataFrame
  driver: csv
  path: inputs/Copernicus/lu_to_roughness_lookup.csv
  filesystem: local
  encoding: UTF-8
  meta:
    category: lookup_table
    description: >
      Manning's n per Copernicus LC100 class (land_use), 23 rows, codes 0-200,
      from HEC-RAS guidance adjusted for GFM. The column name copernicus_worldcover
      is a label only (src/rasters.py indexes by it); its values are LC100 codes.
    source_author: GFM project, values from HEC-RAS (USACE) guidance
    source_url: https://www.hec.usace.army.mil/confluence/rasdocs/r2dum/latest/developing-a-terrain-model-and-geospatial-layers/creating-land-cover-mannings-n-values-and-impervious-layers
    source_access: project table (values from public-domain HEC-RAS guidance)
    source_version: project table
    source_license: project-internal (HEC-RAS documentation is US public domain)
    fields:
      - name: copernicus_worldcover
        type: Integer
        description: Copernicus LC100 class code (0, 20, 30, ..., 200).
      - name: lu_name
        type: String
        description: Land cover class name.
      - name: manning_n
        type: Real
        description: Manning's n roughness coefficient.

# .gfc (ICGEM spherical-harmonic coefficients) are read by pyshtools in
# src/vertical_datum.compute_geoid_offset_grid; data_type/driver only satisfy the
# catalog parser so get_source(...).path resolves.
goco06s:
  data_type: DataFrame
  driver: csv
  path: inputs/ICGM/GOCO06s.gfc
  filesystem: local
  meta:
    category: geodesy
    description: >
      GOCO06s satellite-only gravity field model, degree/order 300. Defines the
      GOCO06s geoid that DeltaDTM (from EGM2008) and COAST-RP (from local MSL via
      MDT) are both converted to.
    max_degree: 300
    source_author: GOCO consortium (A. Kvas, T. Mayer-Guerr et al.)
    source_url: https://doi.org/10.5880/ICGEM.2019.002
    source_access: open download
    source_version: GOCO06s
    source_license: CC-BY-4.0
    paper_ref: Kvas et al. (2021), GOCO06s - a satellite-only global gravity field model,
      Earth Syst. Sci. Data 13, 99-118.
    paper_doi: 10.5194/essd-13-99-2021

egm2008_geoid:
  data_type: DataFrame
  driver: csv
  path: inputs/ICGM/EGM2008.gfc
  filesystem: local
  meta:
    category: geodesy
    description: >
      EGM2008 Earth Gravitational Model, degree/order 2190 (truncated to GOCO06s'
      degree in use). Gives N_EGM2008 for the EGM2008 -> GOCO06s DEM correction
      (src/vertical_datum.py, applied by extract_dem.py).
    source_author: N.K. Pavlis et al., US National Geospatial-Intelligence Agency (NGA)
    source_url: https://icgem.gfz.de/tom_longtime
    source_access: open download
    source_version: EGM2008
    source_license: NGA public release, distribution unlimited
    paper_ref: Pavlis et al. (2012), The development and evaluation of the Earth
      Gravitational Model 2008 (EGM2008), J. Geophys. Res. 117, B04406.
    paper_doi: 10.1029/2011JB008916

# The on-disk directory is "Aviso" (mixed case): Linux mounts are case-sensitive.
mdt_cnes_cls22:
  data_type: GeoDataset
  driver: netcdf
  path: inputs/Aviso/mdt_hybrid_cnes_cls22_cmems2020_global.nc
  crs: 4326
  filesystem: local
  meta:
    category: ocean
    description: >
      Mean dynamic topography CNES-CLS22 (hybrid), mean 1993-2012 sea-surface height
      above the GOCO06s geoid, 1/8 deg, ocean only. H_MSL = H_GOCO06s - MDT;
      COAST-RP and GEBCO levels are converted with H_GOCO06s = H_MSL + MDT
      (prepare_boundary_conditions.compute_mdt_correction, sfincs_tiles/mdt.py).
    variable_mdt_units: m
    variable_mdt_sign_convention: positive upward (sea surface above geoid)
    source_author: S. Jousset, S. Mulet, E. Greiner et al., CLS / CNES (AVISO+)
    source_url: https://www.aviso.altimetry.fr/en/data/products/auxiliary-products/mdt/mdt-global-cnes-cls.html
    source_access: free registration (AVISO+ account)
    source_version: CNES-CLS22
    source_license: AVISO+ licence agreement, standard product (free, registration required)
    paper_ref: Jousset et al. (2026), New global mean dynamic topography CNES-CLS-22
      combining drifters, hydrography profiles and high frequency radar data,
      Earth Syst. Sci. Data 18, 2285-2303.
    paper_doi: 10.24400/527896/a01-2023.003 (product); 10.5194/essd-18-2285-2026 (paper)
