# Values the existing deltas_ssp126 outputs were computed with; merged after deltas_ssp126.yml by materialize_configs.py. Delete a key to follow config.yml (then re-run).
analysis: {plot_timeseries: true}
population_growth:
  output_years: [2025, 2030, 2035, 2040, 2045, 2050, 2060, 2075, 2100]
visualization:
  growth_rates: {max: 1.5, min: -0.5}
  slr_interp: {max_mm: 1500, n_points: 100}
simulation:
  flooding:  # computed with attenuated SLR propagation and no duration correction (config.yml: two_component, B on)
    slr_propagation: attenuated
    duration_correction: {enabled: false}
