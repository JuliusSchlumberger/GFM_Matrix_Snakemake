# ~500-tile calibration population for the sweep-budget / obstacle-coupling studies
# (docs/methods_03_calibration_sensitivity.md). 571 hop_distance==0 candidates stratified by size
# and geography (calibration_studies/select_study_candidate_tiles.py); dry tiles are dropped by
# calibration_studies/aggregate_wet_tiles.py. Own model_outputs; boundary conditions are shared
# with production (they do not depend on tile geometry).

tile_grid:
  path: "{root}/calibration_500_tiles/calibration_500_tiles_grid.gpkg"

simulation:
  model_outputs: "{root}/calibration_500_tiles/model_outputs"
  # Ceilings well above production (max_rounds 40, max_outer_iterations 4) to probe convergence.
  flooding:
    max_rounds: 100
    obstacle_coupling:
      max_outer_iterations: 15

# One scenario per tile. slr_intensities must be set: merged_waterlevel_names() unions it with
# waterlevel_names, so leaving it unset would add config.yml's adaptation SLR levels.
boundary_conditions:
  return_periods: [100]
  waterlevel_names: ["SLR_0"]
adaptation:
  slr_intensities: []

# All tiles are hop 0 (no cross-tile dependency), so preprocess+simulate run fused per batch
# (generate_hpc_preprocess_job.py --calibration --fuse), all on 1vcpu nodes.
# 9 h is an accepted-risk budget: worst case (no early exit, 1500 round-equivalents/tile) is
# ~0.75 h preprocessing + ~14.1 h simulation on 30 cores, but most tiles converge far earlier.
# A time-limit kill is safe to resubmit (jobs pass --rerun-incomplete).
hpc:
  n_nodes: 30
  # jobs_dir defaults to production's model_outputs/hpc_jobs; isolate it.
  jobs_dir: "{root}/calibration_500_tiles/model_outputs/hpc_jobs"
  sbatch:
    time: "0-09:00:00"
