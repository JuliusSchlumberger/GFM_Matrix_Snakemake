# Wales global-input baseline: production (global DeltaDTM DEM, global COAST-RP boundaries) on
# the production tiles under wales_local_input.yml's fine tiles, closed over hop seeding
# (select_country_tiles.py --footprint). Tile inputs and results are production's, so the
# production run keeps these; merges, figures and scores stay here. Scenario override layer on
# config.yml + config_local.yml (config_utils.materialize_config).

tile_grid:
  path: "{processed_inputs_dir}/mask/validation/wales_global_input_tiles.gpkg"

postprocessing:
  merge_only: true  # validation run: the HPC postprocess chain merges only, no exposure / flood totals
  merged_outputs: "{root}/wales_global_input/merged_results"
visualization:
  output_dir: "{root}/wales_global_input/figures"
validation:
  # Isolated from the shared default - see england_global_input.yml's matching override.
  output_dir: "{root}/wales_global_input/validation"
hpc:
  jobs_dir: "{root}/wales_global_input/hpc_jobs"

boundary_conditions:
  # Only what the benchmarks score: RP100 and RP250 bracket the ~RP200 flood zones
  # (data_catalog_validation.yml comparison_return_periods), present day.
  return_periods: [100, 250]
  waterlevel_names: ["SLR_0"]
# merged_waterlevel_names() unions this with waterlevel_names.
adaptation:
  slr_intensities: []
