# HPC (Linux) path overrides, Hydrax values (copy config_hpc.yml.example for another cluster).
# Loaded only by the HPC job generators (config_utils.load_config(..., extra_override="config_hpc.yml")),
# so the Windows preprocessing machine can resolve paths both locally and as the compute nodes see them.
# Only include keys to override; the rest comes from config.yml (+ config_local.yml).

paths:
  # Linux mount of the same shared storage as the local paths.root. Keep root and code_root
  # equal to GFM_DATA_ROOT / GFM_CODE_ROOT in sfincs_tiles/hydrax_env.sh.
  root: "/p/11212688-004-global-floodmaps/modelling"                     # ← change to your HPC's mount path

  # Linux repo checkout; overrides config_local.yml's Windows code_root.
  code_root: "/u/schlumbe/gfm_code"           # ← must be an absolute path: this gets embedded as `cd "{code_root}"` in
  # generated sbatch scripts, and bash does NOT expand `~` inside double quotes
