# Bangkok / Chao Phraya basin case study: 6 core tiles (1026, 1048, 1195 hop 0; 3930, 3933, 3943
# hop 1) covering the case polygon ({root}/bangkok_chao_phraya/bangkok_chao_phraya_domain.gpkg,
# layer `bangkok_tile`), plus hop-0 seeding dependencies 1092, 1194, 1199 (selected via
# select_country_tiles.py's _hop_distance_closure). Full RP x SLR grid; hop 0 must finish before
# hop 1 (dependency not in the Snakemake DAG, see run_eikonal_cli.collect_neighbor_wave_seeds).
# Scenario override layer on config.yml + config_local.yml (config_utils.materialize_config).

tile_grid:
  path: "{processed_inputs_dir}/mask/bangkok_chao_phraya_tiles.gpkg"

# Isolated output paths, separate from production.
simulation:
  model_outputs: "{root}/bangkok_chao_phraya/model_outputs"
  preprocessing_inputs_dir: null  # own per-tile inputs under model_outputs
postprocessing:
  merged_outputs: "{root}/bangkok_chao_phraya/merged_results"
visualization:
  output_dir: "{root}/bangkok_chao_phraya/figures"
  growth_rates: {max: 1.5, min: -0.5}
  slr_interp: {max_mm: 1500, n_points: 100}
hpc:
  jobs_dir: "{root}/bangkok_chao_phraya/model_outputs/hpc_jobs"

# Deliverable scope: adaptation levels, figures and the population years reported.
adaptation:
  slr_intensities: [SLR_500, SLR_1000, SLR_1500]
analysis: {plot_timeseries: true}
population_growth:
  output_years: [2025, 2030, 2035, 2040, 2045, 2050, 2060, 2075, 2100]
