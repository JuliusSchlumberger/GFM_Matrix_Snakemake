# Configuration for the GFM Aqueduct preprocessing & simulation workflow.
# Parameters are grouped by pipeline stage. 


# ── DATA CATALOGS ─────────────────────────────────────────────────────────────
paths:
  # Machine-specific root directory for all project data and model outputs.
  # Using config_local.yml (git-ignored) is the preferred way to override this per-machine, so that the repository clone can be shared across multiple machines without editing this file.
  root: "D:/GFM"  # storage of outputs and input data
  code_root: "C:/Users/Schlu005/GFM" # Root of the code

  hydromt_data_catalog: "snakemake_workflow/config/data_catalog_gfm.yml" # relative to the code root

  processed_inputs_dir: "{root}/processed_inputs" # # Directory for prepare_boundary_conditions.py's intermediate files
# ── SYNC DELTADTM ──────────────────────────────────────────────────────────────
sync_deltadtm:  # Used by: preparation/sync_deltadtm.py.
  zip_download_dir: "{root}/inputs/DeltaDTM/_zips" # Temp directory for the downloaded .zip archives
  delete_zips_after_extract: true

# ── VERTICAL DATUM CORRECTION (DEM) ─────────────────────────────────────────────
# DEM elevations are always geoid-corrected EGM2008 -> GOCO06s (see
# src/vertical_datum.py), matching the MDT-corrected COAST-RP forcing below.
vertical_datum_correction: # Used by: rules compute_geoid_offset_raster / extract_dem
  offset_raster_path: "{root}/inputs/ICGM/geoid_offset_egm2008_goco06s.tif"

# ── PREPARATION PIPELINE SWITCHES ─────────────────────────────────────────────
preparation: # Used by: preparation/run_preparation.py
  sync_deltadtm:       true   # download DeltaDTM DEM/mask tiles from 4TU.ResearchData
  fix_ocean_mask:      true   # correct ocean_code mask misclassification against real OSM
  # land polygons, IN PLACE on the per-tile mask .tif files, before the VRT mosaic is built
  # over them (preparation/fix_ocean_mask_with_osm_land.py) - see that script's docstring
  build_deltadtm_vrt:  true   # build deltadtm.vrt / deltadtm_mask.vrt from those tiles,
  # with portable RELATIVE source paths (preparation/build_deltadtm_vrt.py) - separate
  # from sync_deltadtm so the mosaics can be rebuilt on their own, cheaply, without
  # re-downloading tiles
  tile_generation:     true   # build the connectivity-first domain manifest -> tile_grid.path
  # (REPLACES tile_mask_creation/select_tiles/merge_tiles, the adaptive parent/child
  # pipeline that replaced them, and the 13-stage greedy-covering/shave pipeline that
  # replaced THAT in turn - see src/connectivity_tiling.py and
  # docs/methods_01_tile_processing_and_waterlevels.md section 3)
  boundary_conditions: true   # COAST-RP + SLR fingerprint scenario NetCDFs

# ── TILE GENERATION (connectivity-first domain construction, 2026-10 -
# REPLACES the 13-stage greedy-covering/shave pipeline, itself gone now) ──
# See src/connectivity_tiling.py for the actual algorithms and
# docs/methods_01_tile_processing_and_waterlevels.md section 3 for the full
# design/reasoning and real global validation numbers. Frozen geometry DAG:
# this whole section only depends on the mask, DEM and elev_threshold_m -
# never on scenario (Coast-RP station VALUES, SLR, RP) - so the tile
# manifest is computed once and frozen. Each tile gets its own
# boundary-condition stations directly at simulation time
# (extract_boundaries.py), so nothing here feeds a separate forcing-context
# computation.
#
# Known scope change vs. the old pipeline: there is no equivalent of the old
# exposure filter (filter_and_shave_chunks used to drop any chunk with zero
# WorldPop population anywhere in it) - this method can produce domains over
# genuinely uninhabited floodable land (e.g. Arctic/Antarctic tundra) that
# the old pipeline would have dropped. Not yet revisited; flagged here
# rather than silently decided.
tile_generation:
  elev_threshold_m: 30 # DeltaDTM's own <=30m real validity envelope. floodable =
  # valid DEM AND elevation < this; land with NO valid DEM reading does NOT
  # count as floodable. No plausible SLR+return-period combination approaches
  # this value (consistent with the pre-existing land_fill_value_m=99m
  # sentinel's own stated reasoning).
  ocean_code: 1 # mask value treated as "ocean" - the only code Phase 1's
  # connectivity graph treats as a non-connector, and the only code Phase 5's
  # ocean-touch check looks for. Deliberately NOT lake(2)/river(3), matching
  # flood_model._idw_seed_values' own ocean_code=1 convention - inland water
  # stays "keep"-able land-equivalent for Phase 3's trim step, only open
  # ocean is excluded.
  river_code: 3 # mask value treated as "river" - NOT used by this module
  # itself (the old pipeline's river-mouth marking is retired), but still a
  # live, load-bearing constant read directly by run_aqueduct.py/
  # run_aqueduct_cli.py/run_aqueduct_validation_sfincs.py - kept here.

  coarse_resolution_m: 500 # standard working resolution for every coarse
  # (non-native) read in this pipeline: Phase 1's edge-connectivity check,
  # Phase 3's trim/split grid, and Phase 5's ocean-touch check - deliberately
  # the SAME value everywhere rather than near-duplicate parameters.

  # --- Phase 1 (build_connectivity_graph) ---
  strip_resolution_m: 500 # resolution of the thin cross-border strip read
  # when checking whether real floodable land touches across a shared tile
  # edge - same value as coarse_resolution_m by default, kept separate since
  # it's conceptually a different check (edge connectivity, not interior
  # content).
  strip_width_deg: 0.02 # ~2km - width of that cross-border strip on each
  # side of the shared edge. Cheap, bounded-cost check.

  # --- Phase 3 (split_component_to_budget) ---
  budget_cells: 25_000_000 # split target, in native (~30m) cells - a
  # component's trimmed bbox is recursively split until every piece is at or
  # under this. Tuned against real Southeast Asia/Europe data to land a
  # majority of domains in the 20-30M ideal band (2026-10) - NOT the same
  # thing as hard_ceiling_cells below, which bounds the LATER merge step.
  min_split_gap_coarse_cells: 10 # minimum width (in coarse_resolution_m
  # cells, ~5km at the default 500m) of a contiguous all-non-floodable
  # interior row/column band before Phase 3 treats it as a genuine natural
  # gap worth splitting on for free, rather than falling through to a forced
  # geometric cut. This is the value actually used to validate the method on
  # real Southeast Asia/Europe/world-scale data (2026-10) - NOT the old
  # pipeline's own very differently-tuned shave-era value (60, ~30km) for a
  # completely different splitting algorithm; that tuning history doesn't
  # carry over.
  overlap_target_km: 20 # bounded overlap width duplicated on both sides of a
  # FORCED split (used only when no natural gap exists) - the one place a
  # synthetic seam is introduced, always compensated by this explicit margin.

  # --- Phase 4 (merge_small_domains_tiered) - two-tier post-hoc merge of
  # undersized domains, never crossing a component boundary ---
  merge_trigger_cells: 20_000_000 # a domain below this size is a merge
  # candidate.
  preferred_ceiling_cells: 30_000_000 # tier 1: prefer the nearest same-
  # component neighbour whose merge result stays under this (keeps the
  # typical result centred near the ideal band).
  hard_ceiling_cells: 100_000_000 # tier 2 (last resort) / absolute cap -
  # also the ceiling Phase 6's coastal pad below must never push a domain
  # past.

  # --- Phase 6 (pad_hop0_domains_bbox) - explicit coastal buffer, hop=0
  # domains only (see that function's own docstring for why hop=0-only and
  # why it runs strictly after Phase 5's hop-distance BFS) ---
  coastal_buffer_km: 20 # outward pad applied to every hop_distance==0
  # domain's bbox, on each side, restoring an explicit minimum-ocean-margin
  # guarantee around a coastal nose/headland (Phase 3's own trim only gives
  # an IMPLICIT buffer - see the pad function's docstring) - same order of
  # magnitude as overlap_target_km above.

  write_debug_gpkg: true # write one GeoPackage per pipeline phase (numbered
  # to match build_tile_manifest.py's own docstring phase list, e.g.
  # 01_domains_presplit.gpkg, 03_dropped_unreachable.gpkg) to debug_gpkg_dir
  # below - lets every drop and every intermediate shape change be inspected
  # in QGIS, not just the final tile_grid.path output. Cheap relative to the
  # raster I/O-heavy phases themselves, so left on by default; set false to
  # skip it for a routine run. NOTE: unlike the old pipeline, this does NOT
  # gate checkpointing/resume - that always works via
  # tile_generation_phase3_checkpoint.jsonl under debug_gpkg_dir regardless
  # of this flag.
  debug_gpkg_dir: "{processed_inputs_dir}/mask/tile_generation_debug" # directory for
  # the per-phase GeoPackages above, and the Phase 3 resume checkpoint.

# ── TILE GRID (final manifest location - read by run_preparation.py's
# tile_generation step AND everything downstream: Snakefile, extract_tile_geometry) ──
tile_grid:
  path: "{processed_inputs_dir}/mask/domain_tiles_global.gpkg" # Note this is both target of the preparation pipeline and
  # starting point for simulation run. "global" matches reality - the underlying DeltaDTM mask/DEM data (and every
  # tile-generation algorithm there's been) have never been region-restricted. A COMPUTED tile-generation output
  # (like its sibling tile_generation.debug_gpkg_dir), not raw synced source data, so it belongs under
  # processed_inputs like every other derived preparation artifact. Migrated 2026-10 to the connectivity-first
  # method's output (src/connectivity_tiling.py) - the pre-migration file was kept as
  # domain_tiles_global_pre_connectivity_migration.gpkg alongside it.


# ── TILE SPLITTING (OOM RECOVERY) ───────────────────────────────────────────────
tile_split: # Used by: run_pipeline.py to split OOM tiles and re-run Snakemake.
  fraction: 0.667 # Each half spans this fraction of the parent tile's extent
  max_depth: 2 # Maximum number of times a single original tile may be recursively split
  max_retries: 5 # Maximum number of times a single original tile may be recursively split


# ── BOUNDARY CONDITIONS ───────────────────────────────────────────────────────
# Used by: prepare_boundary_conditions.py (generates scenario files),
#          extract_boundaries.py (loads per-tile stations from those files).
boundary_conditions:
  waterlevel_nc_dir: "{processed_inputs_dir}/WL_scenarios" # Directory for water level scenario files

  # IPCC AR6 regional SLR projection scenario/confidence level used to build
  # the SLR fingerprints
  slr_scenario: "ssp245" # options: slr_scenario ssp126/ssp245/ssp585
  confidence_level: "medium" # options: low/medium
  coastrp_min_lat: -60  # exclude antarctic stations (no exposure)

  # MDT (mean dynamic topography) is always ADDED to COAST-RP storm-tide
  # levels (fixed 2026-09 - was wrongly subtracted; see
  # preparation/prepare_boundary_conditions.py's module docstring and
  # tests/martinique_diagnostics/ for the real-data investigation), re-
  # referencing them from local MSL to the GOCO06s geoid - matching the
  # DEM's own geoid correction above.
  mdt_correction: # Vertical-reference correction for COAST-RP storm-tide levels
    mdt_variable: "mdt"
    fallback_search_deg: 3.0

  return_periods: # Coast-RP return periods (wildcards) to simulate flood exposure fore
    # - 1
    - 2
    - 5
    - 10
    - 25
    - 50
    - 100
    - 250
    - 500
    - 1000

  slr_scenarios: # SLR scenario names used as wildcards
    - "SLR_0"
    - "SLR_500"
    - "SLR_1000"
    - "SLR_1500"
    - "SLR_2000"

  station_search_buffer_deg: 1.0 # extract_boundaries.py: buffer (degrees) around a tile's bbox to search for Coast-RP stations
  station_search_min_size_deg: 2.0 # extract_boundaries.py (boundaries.select_stations_for_tile): minimum
  # search-box width/height (degrees), centred on the tile - the ACTUAL search box is whichever is larger
  # per dimension, "bbox + station_search_buffer_deg" or this. Many chunks are now very small
  # (post-2026-08 dedup/split, now also the connectivity-first split/merge - see src/connectivity_tiling.py), so this guarantees a station search always covers
  # a reasonable area regardless of chunk size, rather than relying on station_search_buffer_deg alone
  # (which happens to give >=2deg today only because it's 1.0 - a coincidence, not a guarantee, if that
  # value is ever tuned down for large chunks). First-pass estimate, not validated against real data.
  connectivity_resolution_m: 500 # extract_boundaries.py: coarse cell size (metres) for the
  # ocean-connectivity station filter (filter_stations_by_ocean_connectivity) - deliberately
  # much coarser than DeltaDTM's native ~30m so a multi-degree search window stays tractable.
  connectivity_water_fraction_threshold: 0.5 # extract_boundaries.py: minimum fraction of a
  # coarse cell's underlying native pixels that must be ocean (mask==1 only, not
  # lake/river) for the cell to count as water for the connectivity filter above.
  nc_filename_template: "COAST-RP_EWL_{return_period}_{waterlevel_name}.nc"
  nc_variable_template: "COAST-RP_EWL_{return_period}_{waterlevel_name}"
  station_x_var: "station_x_coordinate"
  station_y_var: "station_y_coordinate"

  # RETIRED (2026-08): connectivity_forcing (straight-line-IDW along-water
  # boundary forcing) and the along-water Dijkstra-graph design before it -
  # never validated beyond a regional subset, superseded by the frozen-
  # geometry tile-generation pipeline's own hop-distance/neighbour-forcing
  # direction (src/connectivity_tiling.py's compute_hop_distances, 2026-10 -
  # was src/tile_chunking.py's compute_run_order before the connectivity-
  # first migration) as the intended way to give hinterland tiles non-ocean
  # boundary forcing.

  # NOT IMPLEMENTED - inter-tile boundary propagation for hinterland
  # (hop>=1) tiles: a hop>=1 tile doesn't need its own ocean edge, and COULD
  # draw extra virtual stations from an already-simulated, strictly-lower-
  # hop neighbour's own results - but picking WHICH points needs the
  # neighbour's actual simulated output (only the very few genuinely wet
  # cells within the overlap are useful), so it can only happen AFTER that
  # neighbour's own run, in a step that doesn't exist yet. A tile-
  # generation-time precompute (candidate point locations from frozen
  # geometry alone) was tried and rejected: real overlaps can span up to
  # hundreds of km, not thin border strips, so any fixed grid resolution
  # produces a huge, mostly-dry-land point count.
  # boundaries.sample_waterlevel_at_points (the raster point-lookup
  # primitive) already exists, ready for whenever this gets built.

# ── RASTER FORMAT ──────────────────────────────────────────────────────────────
raster_format:
  driver: "GTiff"
  compression: "zstd"
  predictor: 3
  nodata: -9999


# ── FLOOD SIMULATION ──────────────────────────────────────────────────────────
simulation: # Used by: preprocessing rules
  model_outputs: "{root}/model_outputs"  # directory where per-tile "{tile_id}/inputs" and
  # "{tile_id}/results" are created

  # Flood model implementation: src/flood_model.py's flood_depth_dense
  # (dense domain, round-based solve capped at flooding.max_rounds below).
  # Its fixed-3-sweep mode is validated bit-for-bit identical to the
  # original Aqueduct/Julia reference implementation across 26 real tiles
  # spanning ~9M-135M cells each - see docs/python_vs_julia_qa.md. That
  # fixed-sweep mode remains available on demand (flood_depth_dense's own
  # `sweep_budget` param), just no longer the default (see max_rounds below).
  model_bbox_buffer_arcsec: 3 # Buffer added to tile's previously shaved bbox to ensure thin strip of ocean.
  dem_gap_fill: # land-nodata gap handling: large connected (4-connectivity) group get Nodata value, other IDW-interpolation
    min_hard_fill_component_size: 15 # a missing-land DEM cell is only hard-filled to land_fill_value_m for patches larger than that
    interp_max_search_distance: 100
    interp_smoothing_iterations: 0
    # Elevation (m) written for large missing-land DEM gaps. 99m (not the
    # historical 9999m) - comfortably above DeltaDTM's real <=30m validity
    # envelope (so it still reads as implausibly-high, never-floods terrain)
    # while fitting the int16-centimetre DEM encoding (src/rasters.py's
    # DEM_NODATA_M/DEM_SCALE) - 9999m would overflow int16 at cm scale by ~30x.
    land_fill_value_m: 99

  flooding: # Flood model parameters.
    resolution: 30       # output raster resolution in metres
    knn: 15              # number of nearest water level stations used
    # Default Manning's n roughness (÷ 100) for cells with no land use class.
    default_friction: 0.002
    # Runtime multiplier applied to the (already land-use-derived, already
    # decoded) friction raster - not baked into compute_friction.py's own
    # preprocessing output, so the expensive land-use-derived raster is
    # computed once and reused unscaled by every sweep combination that
    # varies a different parameter. The raw friction value (Manning's_n/100)
    # is used directly as cost-per-grid-step, with no distance term anywhere
    # in the solver; unscaled, this produces water-level attenuation ~30x
    # weaker than the ~0.1-1.2 m/km range reported in Vafeidis et al. (2019)
    # for comparable land cover - x30 brings it into that range (DeltaDTM's
    # own native ~30m grid step is the origin of the factor).
    friction_scale_factor: 30.0

    # Caps the eikonal solve's round-based mode (4 individual directional
    # sweeps per round, each round checked for early-exit convergence - see
    # src/eikonal.py's solve_eikonal_dense and src/flood_model.py's
    # flood_depth_dense). Used by both the non-coupling single solve and
    # each outer iteration's inner solve when obstacle_coupling is enabled
    # (below) - not obstacle_coupling-specific, hence top-level here rather
    # than nested under it. 40 rounds: the sweep-budget calibration study's
    # conclusion (calibration_studies/test_sweep_budget_calibration.py, see
    # docs/methods_03_calibration_sensitivity.md §2) - 58.5% of tiles
    # strictly converge by round 40, and of the ones that don't, 97.8%
    # already have their flood extent (depth>0 cells) fully frozen by then
    # too (the residual is a small number of cells' depth still settling,
    # not genuinely unconverged extent). The old fixed-sweep_budget=3 mode
    # (real Aqueduct/Julia's own bit-exact-validated behaviour) remains
    # available via flood_depth_dense's own `sweep_budget` parameter, just
    # no longer the default.
    max_rounds: 40

    # Round-level early-exit convergence threshold (metres) for the
    # round-based solve above - a round stops the solve early once its max
    # per-cell waterlevel change drops to/below this. Used by both the
    # non-coupling single solve and each outer iteration's inner solve when
    # obstacle_coupling is enabled (below). 0.03m sits well below the 0.1m
    # decision-relevant flood/no-flood depth threshold, so tightening/
    # loosening this trades convergence precision against sweep count
    # directly - see src/flood_model.py's WATERLEVEL_EPSILON_M comment.
    waterlevel_epsilon_m: 0.03

    # Mitigates a structural weakness Fast Sweeping shares with cost-distance
    # flood models (Kasmalkar et al. 2024's "Flow-Tub" critique): a
    # friction-cheap shortcut through terrain higher than the
    # locally-attenuated water level can produce an illegitimate high
    # potential value beyond it. When enabled, blocks such cells
    # (friction -> 9999) and re-solves in an outer loop instead of a single
    # solve - see src/flood_model.py's flood_depth_dense docstring for the
    # full algorithm and monotonicity/termination argument. Enabled by
    # default - validated on both the wave-0 (real boundary stations) and
    # hop>=1 (explicit seed cells) paths; see that docstring.
    obstacle_coupling:
      enabled: true
      # 4: the obstacle-coupling calibration study's conclusion (see
      # docs/methods_03_calibration_sensitivity.md §3), with the blocked-cell
      # set accumulated monotonically across outer iterations (see
      # flood_model.py's own `blocked = blocked | prev_blocked` comment) -
      # without that, most non-converging tiles oscillate indefinitely
      # rather than settle. With it: all 500/500 tiles run to full
      # convergence within 4 outer iterations - 370 at the earliest
      # mathematically possible point (outer=2), 123 at outer=3, 7 at
      # outer=4. "n outer iterations" counts inner solves performed, not
      # blocking rounds applied to the output - a tile that stops at solve
      # k only ever had (k-1) rounds of
      # dynamic blocking baked into its returned flood map (solve k's own
      # blocking decision is discarded once its delta is found negligible;
      # see methods_03_calibration_sensitivity.md §3 for the full reasoning).
      max_outer_iterations: 4
      outer_convergence_pct: 0.01  # stop early once < this % of the tile's cells are newly blocked in an outer iteration

  # Peak-memory estimate for run_aqueduct's `resources: mem_mb` (replaces the
  # old aqueduct_runs=1 serialization - see aqueduct_runner.
  # estimate_aqueduct_mem_mb). Calibrated from 7 real tiles; deliberately
  # generous given real per-tile variance beyond pixel count alone. Retune
  # from production telemetry if jobs are consistently over/under-budgeted.
  aqueduct_mem_estimate:
    base_mb: 1000
    bytes_per_pixel: 80

# ── HPC DISPATCH ────────────────────────────────────────────────────────────────
# Used by: rule generate_aqueduct_jobs (rules/hpc_dispatch.smk) /
# scripts/generate_aqueduct_jobs.py. Wave-based hinterland forcing
# (src/connectivity_tiling.compute_hop_distances's hop_distance column) means a
# hop_distance>=1 tile is seeded from a strictly-lower-hop_distance
# neighbour's own output for the same scenario, so tiles are grouped by wave
# FIRST and split into node batches within each wave - this rule generates
# one sbatch script per (wave, node batch) once preprocessing is done, plus
# a submit_waves.sh driver that submits wave 0, then each later wave with a
# SLURM `--dependency=afterany:<every prior-wave job id>` barrier so a
# hop>=1 job never starts before its neighbour's job has finished. The user
# runs submit_waves.sh manually and later runs postprocessing manually once
# results land. Requires a git-ignored snakemake_workflow/config/config_hpc.yml
# (copy from config_hpc.yml.example) pointing paths.root/code_root at the
# Linux HPC mount of this same shared storage.
#
# Within each wave (simulation) / on its own (preprocessing), tiles are
# ALSO split by estimated size (2026-08): Hydrax's regular partitions all
# scale RAM at a fixed 8GB/vCPU (1vcpu=8GB, 4vcpu=32GB, 16vcpu=128GB, ...),
# so a tile whose estimated peak memory (aqueduct_mem_estimate, above)
# would leave little/no headroom on `sbatch`'s partition is routed to
# `sbatch_large` (a bigger partition) instead - large_tile_pixel_threshold
# controls the cutoff. `sbatch`/`sbatch_large` are shared by BOTH
# simulation batching (hpc_dispatch.smk) AND preprocessing batching
# (generate_hpc_preprocess_job.py) - there is no separate preprocessing-only
# config; a preprocessing batch's `cpus_per_task` (passed to `snakemake
# --cores`) determines its actual Snakemake-level parallelism, not just its
# SLURM allocation size, so a `cpus_per_task: 1` partition means preprocessing
# on that batch's tiles runs fully serial, not just one simulation tile at a time.
hpc:
  n_nodes: 40                                        # 2026-10-06, user direction (down from 35) for a preprocess-only submission - a SHARED budget across
  # both size classes per wave, split proportionally by tile count (see hpc_dispatch.smk's own split_batches_proportionally
  # call) - NOT "35 nodes per size class" despite this line's own stale wording below, see that file's own comments for the
  # real (fixed) semantics: the "PER WAVE, PER SIZE CLASS" phrasing here describes the OLD, buggy independent-budget
  # behaviour a 2026-08 fix replaced
  jobs_dir: "{root}/model_outputs/hpc_jobs"           # generated sbatch scripts, resolved_config.yml, submit_waves.sh, logs/
  # Tiles at/above this pixel count go to sbatch_large instead of sbatch,
  # for BOTH preprocessing and simulation batching. Default 70,000,000 is
  # chosen against aqueduct_mem_estimate (base_mb=1000, bytes_per_pixel=80):
  # 1000 + 80*70e6/1e6 = 6600MB, leaving ~1.4GB headroom below a 1vcpu
  # node's 8GB before even accounting for the estimate being deliberately
  # generous. Pixel count itself is estimated from tile bbox area (see
  # hpc_dispatch.smk / generate_hpc_preprocess_job.py), not the real DEM,
  # so this is necessarily approximate - the margin below 8GB is deliberate.
  large_tile_pixel_threshold: 70000000
  # 2026-09: large tiles were regularly not finishing within sbatch_large's
  # time limit. Splits each wave's "large" class across this many times more
  # batches than split_batches_proportionally's own shared-budget result
  # would give it (e.g. 2 = half as many tiles processed serially per node) -
  # applied ON TOP of, not carved out of, "small"'s share, so a wave with
  # large tiles may use more than n_nodes nodes at once. 1 = no change. See
  # hpc_dispatch.smk / generate_hpc_simulation_jobs.py.
  large_tile_batch_multiplier: 2
  sbatch:
    # Deltares Hydrax partitions: 1vcpu/4vcpu/16vcpu/24vcpu/60vcpu (regular),
    # 44vcpu, gpu, test (30 min cap, quick smoke-test before a real run).
    # Responsible-use ceiling is ~240 cores across the vcpu partitions AT
    # ONCE - n_nodes x cpus_per_task, per wave, should stay under that.
    partition: 1vcpu
    account: ""                                       # optional - Hydrax jobs don't require one; leave "" to omit #SBATCH --account
    # days-hours:minutes:seconds, e.g. "1-00:00:00". MANDATORY - an unset
    # Hydrax job silently gets a 1-MINUTE default and is killed at that
    # point regardless of progress. Estimate conservatively (a job is hard-
    # killed at this limit, finished or not) but not wastefully high.
    time: "1-00:00:00"
    # 1vcpu nodes report 7950MB usable (`sinfo -N -o "%N %P %m %c"`), NOT
    # the nominal 8192MB (8GB) - requesting the full nominal amount fails
    # with "Memory specification can not be satisfied". Stay safely under
    # the real ceiling, not the marketing number.
    mem: "7G"
    # For simulation batches: irrelevant beyond the SLURM allocation size
    # (each node runs one tile at a time regardless). For preprocessing
    # batches (generate_hpc_preprocess_job.py): this IS the real
    # `snakemake --cores N` parallelism for that batch - 1 means fully
    # serial preprocessing on "small" tiles, which is most of the domain.
    # Bump this up if preprocessing throughput matters more than minimal
    # per-node footprint.
    cpus_per_task: 1
    # Hydrax uses Environment Modules (Lmod) + conda, not a single module
    # for this custom env - e.g.:
    #   module load miniconda && eval "$(conda shell.bash hook)" && conda activate gfm
    env_activate_cmd: 'module load miniconda && eval "$(conda shell.bash hook)" && conda activate gfm'
  # Same shape as sbatch: above, for tiles at/above large_tile_pixel_threshold
  # - a bigger partition (e.g. 16vcpu=128GB) so the largest tiles in the
  # domain don't OOM on sbatch:'s (e.g. 1vcpu=8GB) node RAM, for BOTH
  # preprocessing and simulation. Expect very few batches here - most tiles
  # stay on sbatch:.
  sbatch_large:
    # 2026-10-06, user direction: dropped from 4vcpu/30G/4 cpus to match
    # sbatch: above - for THIS preprocess-only submission, not needed for
    # the memory margin large-tile simulation batches still rely on (see
    # large_tile_pixel_threshold's own comment: tiles at/above that
    # threshold were sized to leave only ~1.4GB headroom on a 1vcpu node's
    # ~7.95GB usable RAM) - revert to partition=4vcpu/mem=30G/cpus_per_task=4
    # before submitting a simulation run, or the largest tiles risk OOM.
    partition: 1vcpu
    account: ""
    time: "2-00:00:00"             # 2026-09: raised from 1-00:00:00 - large tiles were regularly not finishing in 24h
    mem: "7G"                             # matches sbatch:'s own 1vcpu-node ceiling - see note above
    cpus_per_task: 1
    env_activate_cmd: 'module load miniconda && eval "$(conda shell.bash hook)" && conda activate gfm'


# ── POSTPROCESSING ────────────────────────────────────────────────────────────
# Used by: merge_chunk.py, build_mosaic_vrt.py, plot_merged_results.py,
#          plot_overlap_diagnostics.py.

postprocessing:
  # Root directory for combined (multi-tile) rasters, VRTs and plots.
  merged_outputs: "{root}/merged_results"
  chunk_size_deg: 5 # Spatial chunk size (degrees) used to partition the study area for merging.
  block_size: 2048 # Side length (pixels) of the write blocks used inside each chunk.
  overlap_corr_max_samples: 50000 # Maximum (min, max)-depth-pair random samples per chunk for
  # correlation/agreement diagnostics
  overlap_corr_seed: 42  # Fixed random seed to reproduce identical samples.

  # Visualisation parameters for all postprocessing plots.
  plots:
    enabled: true # to plot merged maps, per-continent overlap correlation/agreement plots
    debug: false # to plot plot_overlap_diagnostics

    # Output resolution (DPI) for all saved plot images.
    dpi: 300
    merged_resolution_arcsec: 120  # 30" ≈ 900 m at the equator;
    waterdepth_cmap: "Blues"
    waterdepth_vmax_m: 10
    merged_map_figsize: [10, 10] # for plot_merged_results

    overlap_pie_colors: # Wedge colours for the per-continent overlap-agreement pie chart
      flood: "#d62728"
      no_flood: "#1f77b4"
      ambiguous: "#7f7f7f"
    overlap_continent_figsize: [13, 6.5] # for the per-continent overlap diagnostic

    n_overlap_locations: 10 # focal tiles shown in the overlap diagnostic figure
    overlap_diag_resolution_arcsec: 240 # Target pixel size for the overlap diagnostic figures
    overlap_diag_figsize: [10, 8] # for each per-tile overlap diagnostic panel
    overlap_tile_cmap: "tab10" # per-tile domain-bbox outline colours
    overlap_diff_cmap: "Reds" # for the overlap-zone max-depth-difference shading


# ── COASTAL PROTECTION BASELINE ────────────────────────────────────────────────
protection: # Used by: analysis/compute_exposure_analysis.py
  baseline_waterlevel_name: "SLR_0" # Reference SLR for which protection standard ensure protection
  default_rp: 5 # minimum protection level assumed where no FLOPROS protection standards are available

exposure: # Used by: scripts/prepare_exposure_grid_chunk.py
  exceedance_threshold_m: 0.10 # Minimum flood depth (m) for a fine pixel to count as "flooded"


# ── ADAPTATION MEASURES ────────────────────────────────────────────────────────
adaptation: # Used by: analysis/compute_exposure_analysis.py
  slr_intensities: # Protection against certain amount of SLR
    - "SLR_500"
    - "SLR_1000"
    - "SLR_1500"

# ── POPULATION GROWTH (SSP SCENARIOS) ─────────────────────────────────────────
population_growth: # Used by: analysis/compute_exposure_analysis.py
  ssps:
    - SSP1
    - SSP2
    # - SSP3
    - SSP5
  # Years for which to produce output columns (5-year grid; intermediate
  # years are linearly interpolated from the 5-year data in the Excel file).
  output_years: # Years for which to produce output columns (intermediate years are linearly interpolated 
    - 2025
    - 2030
    - 2035
    - 2040
    - 2045
    - 2050
    - 2060
    - 2075
    - 2100

# ── ANALYSIS PIPELINE SWITCHES ────────────────────────────────────────────────
analysis: # Used by: analysis/run_analysis.py
  compute_exposure:      true   # baseline / protect / retreat / avoid EAI CSVs
  compute_flood_totals:  true   # per-country total flooded area/exposed population per (RP, SLR),
  # no protection/adaptation applied - consumed by flood_extent_validation's
  # validate_country.py (validation.flood_totals_dir below)
  plot_burning_ember:    true   # impact-matrix (SLR × growth) figures
  plot_adaptation_bars:  false   # grouped bar charts per adaptation strategy
  plot_timeseries:       true   # EAI along SSP SLR trajectories over time
  plot_world_maps:       false  # world choropleth maps (slow for global runs)

  avoid_worker_memory_budget_gb: 4 # number of feasible parallelization stream


# ── VISUALISATION ─────────────────────────────────────────────────────────────
visualization:
  output_dir: "{root}/figures" # Output directory for all generated figures.

  # ── Burning-ember ────────────────────────────────────────
  growth_rates: # relative to baseline year (2020)
    min: -0.5
    max:  1.5
    step:  0.1

  slr_interp: # interpolated based on run scenarios used for smoothing the curve.
    min_mm:   0
    max_mm: 1500
    n_points: 100

  highlight_years: [2050, 2100]

  country_eai_vmax: 1000000 # Fixed y-axis / colour-scale cap (EAI, people)

  # ── SSP SLR trajectory CSV ────────────────────────────────────────────────
  slr_trajectories_csv: "{processed_inputs_dir}/slr_trajectories_global_median.csv"

  # ── Chart aesthetics ──────────────────────────────────────────────────────
  dpi: 200
  cmap_ember: "YlOrRd"
  n_ember_contours: 6 # Number of labelled EAI contour lines drawn on the burning-ember heatmap.

  # ── Figure sizes (inches) ─────────────────────────────────────────────────
  ember_figsize: [8, 7]
  adaptation_bars_figsize: [9, 5]
  world_map_figsize: [14, 7]

  # ── World map ──────────────────────────────────────────────────────────────
  # (min_lat, max_lat) displayed on world choropleth maps.
  world_map_lat_range: [-60, 85]
  world_map_downsample: 4 # Read every Nth geogunit_109 pixel row/col to reduce memory and draw time.
  geo109_subsample: 10 # Read every Nth pixel when building the geogunit_109 -> ISO lookup table (one-time).

  # ── SSP–RCP pairings ─────────────────────────────────────────────────────
  ssp_rcp_codes:
    SSP1: 126
    SSP2: 245
    SSP5: 585

  ssp_colors:
    SSP1: "#1f77b4"   # blue
    SSP2: "#2ca02c"   # green
    # SSP3: "#ff7f0e"   # orange
    SSP5: "#d62728"   # red

  measure_colors:
    baseline: "#7f7f7f"
    protect:  "#1f77b4"
    retreat:  "#9467bd"
    avoid:    "#2ca02c"

  level_linestyles: ["--", ":", "-."] # plot_timeseries.py:
  baseline_linestyle: "-" # plot_timeseries.py:

# ── COASTAL FLOOD-EXTENT VALIDATION ─────────────────────────────────────────────
# Used by: validation/validate_country.py, validation/run_validation.py.
# See docs/methods_04b_MapsValidation.md for the full design.
validation:
  benchmark_catalog: "snakemake_workflow/config/data_catalog_validation.yml"
  benchmark_root: "{root}/inputs/validation" # NOT the GFM catalog's own {root}
  output_dir: "{root}/validation"
  return_period: "RP100"
  waterlevel_name: "SLR_0"
  primary_threshold_m: 0.01 # the single model wet-cell threshold scoring uses everywhere - the
  # model's own depth classification, a separate question from the benchmark's own coverage
  # fraction (never thresholded for scoring at all). Deliberately NOT exposure.exceedance_threshold_m
  # (still 0.10, a different purpose - flood-protection/damage accounting, not extent comparison) -
  # a real, measured sensitivity check (GBR Wales/Scotland, 0.10/0.05/0.01m) found CSI/HR improving
  # smoothly and monotonically all the way down to 0.01m with no noise or reversal, despite 0.01m
  # being below the eikonal solver's own convergence tolerance (simulation.flooding.waterlevel_epsilon_m,
  # 0.03m) - the "pure flood extent, any real depth counts" comparison this enables is more faithful
  # to what the benchmark maps themselves represent (a binary flood/no-flood extent, not a
  # depth-threshold policy choice) than reusing the exposure pipeline's own accounting threshold.
  coastline_tolerance_cells: 1 # v.confusion_counts_tolerant's own dilation radius (pixels, on the
  # model's native 30m grid - simulation.flooding.resolution) - a DIAGNOSTIC CSI_tol/HR_tol/FAR_tol
  # reported alongside (never instead of) the strict CSI/HR/FAR, answering how much of the strict
  # disagreement sits right next to a cell where model and benchmark actually agree (e.g. the
  # permanent-water-mask-vs-benchmark-coastline mismatch - methods_04b_MapsValidation.md's own
  # caveat). 1 cell (30m) matches the real registration-scale evidence already measured for this
  # exact caveat (NN2000-vs-GOCO06s vertical-datum horizontal shift ~2m; DeltaDTM mask native
  # resolution ~25-31m in Norway - both sub-pixel-to-one-pixel) - NOT tuned upward to make CSI_tol
  # look better. Raise only with a real measured reason, and always read it next to
  # pct_disagreement_forgiven (how much of the disagreement the tolerance actually excused) rather
  # than CSI_tol alone - see confusion_counts_tolerant's own docstring for the full guard rationale.
  benchmark_supersample: 5 # rasterisation supersampling factor per model pixel
  benchmark_wet_fraction: 0.5 # DISPLAY ONLY (the agreement-map category raster's own coverage-
  # fraction cutoff - one discrete colour per cell needs a yes/no wet call) and Spain's own
  # connectivity domain construction (src/validation.py::connectivity_domain_mask needs a binary
  # benchmark-wet mask to label, same reason - see that function's own docstring). Scoring itself
  # (validation.confusion_counts_soft, 2026-09-30) weights tp/fp/fn/tn by the real coverage
  # fraction directly instead of thresholding it first, after a per-country sensitivity sweep
  # (DNK/FIN/NOR/FRA single-tile spot-checks, tau in [0,1]) found the optimal threshold diverges
  # by country with no consistent winner - see src/validation.py's own confusion_counts_soft
  # docstring for the full account.
  # Evaluation domain for partial-coverage benchmarks (Spain/France, 2026-10): the benchmark
  # agency's own official study design (meta.study_area per benchmark in
  # data_catalog_validation.yml - geometry_type "perimeter" -> that zone's own polygon used as-is,
  # no buffer; geometry_type "segments" -> a seeded-connectivity domain, not a buffer around the
  # line) - see validate_country.py's own module docstring and src/validation.py's
  # tri_domain_mask/connectivity_domain_mask. Replaced the earlier flat eval_domain.buffer_km
  # margin and its "buffered"/"model_only" domain-variant reporting entirely.
  eval_domain:
    buffer_km: 2.0 # (1) validate_country_depth_bands' own evaluation domain (buffer+cluster,
    # unaffected by the 2026-10 change above - depth-band comparison has no study_area path yet).
    # (2) validate_country()'s own "segments" branch (Spain): NOT the scoring domain any more -
    # purely a chunk-windowing optimization, grouping nearby ARPSI seed segments so the same
    # merged chunk isn't read once per segment - see build_evaluation_clusters' own docstring.
    also_report_model_domain_only: true # validate_country_depth_bands only (see above) -
    # whether to also report the unrestricted "model_only" domain alongside "buffered".
  # Evaluation units = benchmark-geometry clusters (buffer each polygon, merge
  # overlapping ones, process per merged cluster), NOT a uniform grid - see
  # validation.build_evaluation_clusters. Real timing on the Spain benchmark
  # (397 polygons, 2026-09): simplify(100m, preserve_topology=False) +
  # buffer(quad_segs=2) + union_all() -> 182 clusters in <1s. The default
  # topology-preserving simplify and default buffer quad_segs are NOT safe -
  # both hang (>160s) on a real degenerate high-vertex-count record.
  vector_simplify_tolerance_m: 100.0
  buffer_quad_segs: 2
  permanent_water_source: "deltadtm_mask" # data_catalog_gfm.yml key - DeltaDTM's own native-
  # resolution land/ocean/lake/river mask (~25-31m ground cell in Norway, 4-8x finer in area than
  # Copernicus land_use's ~100m - see tests/norway_diagnostics/ for the real quantified
  # comparison, 2026-09). Switched from
  # "land_use" (Copernicus Global Land Cover, still a valid catalog entry, just no longer the
  # default here) - real measured improvement (coastal-strip masking loss 45.7%->30.1% within
  # 240m of shore for Norway) but NOT a full fix: ~1/3 of the original loss was genuine
  # coarse-cell aliasing (now eliminated), the rest is a waterline-DEFINITION disagreement
  # (DeltaDTM/ESA WorldCover's optical water edge vs. a benchmark's own surveyed coastline) that
  # no 30m-resolution mask can resolve - see methods_04b_MapsValidation.md's own caveats section
  # for the full breakdown, and coastline_tolerance_cells above for a diagnostic (not a fix). Was called
  # `landuse_source` before this switch - renamed since that name became misleading once it no
  # longer necessarily points at a land-use product.
  permanent_water_codes: [1, 2, 3] # DeltaDTM mask codes to exclude (1=ocean, 2=lake, 3=river -
  # 0=land, 255=nodata/outside DeltaDTM coverage; confirmed against real tiles 2026-09 - see
  # data_catalog_gfm.yml's own deltadtm_mask entry). Copernicus land_use's own codes were
  # [80, 200] (permanent water bodies / open sea) - NOT interchangeable with these, update both
  # keys together if ever switching permanent_water_source back.
  geogunit_source: "geogunit_protection_units" # data_catalog_gfm.yml key (WRI geogunit_107) -
  # used ONLY by validate_country_national_coverage (validation.read_country_mask) to restrict
  # a national-coverage benchmark's rectangular region bbox down to cells that actually belong
  # to that country - a bbox generous enough to cover a country's own latitude/longitude range
  # can genuinely overlap real neighbouring-country territory (confirmed 2026-09: Norway's
  # `mainland` bbox overlaps real Swedish/Danish coastline, whose own real GFM-modelled
  # flooding would otherwise be scored as a false positive against Norway's benchmark).
  iso_lookup_source: "flopros_protection_standards" # data_catalog_gfm.yml key - geogunit_107-ID-indexed, "ISO" column
  flood_totals_dir: "{root}/merged_results/exposure/flood_totals" # written by
  # analysis/compute_flood_totals.py (analysis.compute_flood_totals switch) - one
  # flood_totals_{ISO}.csv per country, country-wide (not per-region) total flooded
  # area/exposed population per (RP, SLR), no protection/adaptation applied. Read
  # by validate_country.py for the model_total_wet_km2 column
  # (mitigates caveats doc §1.2 - see that file for why a country-wide total, not
  # just a benchmark cluster's own local window, matters). Must match
  # run_analysis.py's own exposure output dir (default "{merged_outputs}/exposure")
  # plus "/flood_totals" if that script's --outdir is ever overridden from its default.
  # (80 = Permanent water bodies, 200 = Open sea - confirmed against
  # inputs/Copernicus/lu_to_roughness_lookup.csv; "is this pixel flooded" is
  # meaningless over water that's always wet regardless of any storm event)
  depth_band_open_ended_min_m: 50.0 # validation.rasterize_depth_bands (variable="depth"
  # benchmarks only, e.g. France's n_iso_ht_* layers): a benchmark ht_max value at/above
  # this, or NaN, is treated as "no upper bound" rather than a literal depth - real French
  # data (2026-09) uses inconsistent per-zone sentinels for the open-ended top band (9999,
  # 999, 99, or NaN with no max recorded at all), so this is a magnitude threshold
  # comfortably above any real closed band (max found: 4.0 m) and comfortably below every
  # sentinel found, not an enumeration of specific sentinel values.
  plots:
    resolution_m: 200
    dpi: 300
    figsize: [10, 10]
    agreement_colors: # ColorBrewer Set1 - distinguishable under common colour-vision deficiencies
      agree: "#4daf4a" # green - both wet
      over:  "#e41a1c" # red   - model wet only
      under: "#377eb8" # blue  - benchmark wet only
