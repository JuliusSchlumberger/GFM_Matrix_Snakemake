# Configuration for the GFM eikonal preprocessing & simulation workflow, grouped by pipeline stage.


# ── DATA CATALOGS ─────────────────────────────────────────────────────────────
paths:
  # `root` (data + outputs) and `code_root` (repo checkout) have no default here: set them in
  # config_local.yml (copy config_local.yml.example) or, on the cluster, config_hpc.yml.

  hydromt_data_catalog: "snakemake_workflow/config/data_catalog_gfm.yml" # relative to the code root

  processed_inputs_dir: "{root}/processed_inputs" # intermediate files of prepare_boundary_conditions.py
  deltas_shapefile: "{root}/inputs/DeltasGlobal/all_deltas.shp" # global delta polygons (deltas deliverable)
# ── SYNC DELTADTM ──────────────────────────────────────────────────────────────
sync_deltadtm:  # Used by: preparation/sync_deltadtm.py.
  zip_download_dir: "{root}/inputs/DeltaDTM/_zips" # temp directory for the downloaded .zip archives
  delete_zips_after_extract: true

# ── VERTICAL DATUM CORRECTION (DEM) ─────────────────────────────────────────────
# DEM elevations are geoid-corrected EGM2008 -> GOCO06s (src/vertical_datum.py), matching the
# MDT-corrected COAST-RP forcing below.
vertical_datum_correction: # Used by: rules compute_geoid_offset_raster / extract_dem
  offset_raster_path: "{root}/inputs/ICGM/geoid_offset_egm2008_goco06s.tif"

# ── PREPARATION PIPELINE SWITCHES ─────────────────────────────────────────────
preparation: # Used by: preparation/run_preparation.py
  sync_deltadtm:       true   # download DeltaDTM DEM/mask tiles from 4TU.ResearchData
  fix_ocean_mask:      true   # correct ocean_code misclassification against OSM land polygons,
  # IN PLACE on the per-tile mask .tif files, before the VRT mosaic is built
  build_deltadtm_vrt:  true   # build deltadtm.vrt / deltadtm_mask.vrt (relative source paths);
  # separate from sync_deltadtm so the mosaics can be rebuilt without re-downloading
  tile_generation:     true   # build the connectivity-first domain manifest -> tile_grid.path
  boundary_conditions: true   # COAST-RP + SLR fingerprint scenario NetCDFs

# ── TILE GENERATION (connectivity-first domains) ──────────────────────────────
# Algorithms: src/connectivity_tiling.py; design: docs/methods_01_tile_processing_and_waterlevels.md §3.
# Depends only on mask, DEM and elev_threshold_m (never on scenario), so the manifest is
# computed once and frozen.
# Unlike the exposure filter of earlier tilings, domains over uninhabited floodable land
# (e.g. Arctic tundra) are kept.
tile_generation:
  elev_threshold_m: 30 # floodable = valid DEM AND elevation < this (DeltaDTM's <=30m validity
  # envelope); land without a valid DEM reading is not floodable
  ocean_code: 1 # mask value treated as ocean (non-connector in Phase 1, ocean-touch check in
  # Phase 5); lake(2)/river(3) deliberately stay land-equivalent, as in flood_model._idw_seed_values
  river_code: 3 # mask value treated as river; read by run_eikonal.py / run_eikonal_cli.py

  coarse_resolution_m: 500 # resolution of every coarse read (Phase 1 edge check, Phase 3 trim/split
  # grid, Phase 5 ocean-touch check)

  # --- Phase 1 (build_connectivity_graph) ---
  strip_resolution_m: 500 # resolution of the cross-border strip read for edge connectivity
  strip_width_deg: 0.02 # ~2 km strip width on each side of a shared edge

  # --- Phase 3 (split_component_to_budget) ---
  budget_cells: 25_000_000 # split target in native (~30 m) cells; tuned so most domains land in
  # the 20-30M band. Not hard_ceiling_cells, which bounds the later merge
  min_split_gap_coarse_cells: 10 # min width (coarse cells, ~5 km at 500 m) of an all-non-floodable
  # band to split on as a natural gap instead of a forced geometric cut
  overlap_target_km: 20 # overlap duplicated on both sides of a FORCED split (no natural gap)

  # --- Phase 4 (merge_small_domains_tiered): merges never cross a component boundary ---
  merge_trigger_cells: 20_000_000 # domains below this are merge candidates
  preferred_ceiling_cells: 30_000_000 # tier 1: nearest same-component neighbour whose merge stays under this
  hard_ceiling_cells: 100_000_000 # tier 2 / absolute cap; the Phase 6 pad must not exceed it either

  # --- Phase 6 (pad_hop0_domains_bbox): coastal buffer, hop=0 domains only ---
  coastal_buffer_km: 20 # outward bbox pad per side, guaranteeing a minimum ocean margin

  # Per-phase GeoPackages (00_raw_tile_index.gpkg .. 04_tile_grid_final.gpkg) and the Phase 3
  # resume checkpoint (tile_generation_phase3_checkpoint.jsonl) are always written next to
  # tile_grid.path; the checkpoint is required for resuming, so there is no flag to disable them.

# ── TILE GRID (final manifest; read by run_preparation.py and everything downstream) ──
tile_grid:
  path: "{processed_inputs_dir}/mask/domain_tiles_global.gpkg" # output of preparation, input of simulation


# ── TILE SPLITTING (OOM RECOVERY) ───────────────────────────────────────────────
tile_split: # Used by: run_eikonal_dag.py to split OOM tiles and re-run Snakemake.
  fraction: 0.667 # each half spans this fraction of the parent tile's extent
  max_depth: 2 # max times a single original tile may be recursively split
  max_retries: 5 # max Snakemake runs (initial + reruns after splitting) per run_eikonal_dag.py call


# ── BOUNDARY CONDITIONS ───────────────────────────────────────────────────────
# Used by: prepare_boundary_conditions.py (scenario files), extract_boundaries.py (per-tile stations).
boundary_conditions:
  waterlevel_nc_dir: "{processed_inputs_dir}/WL_scenarios"

  # IPCC AR6 regional SLR projection (SSP-RCP code) and confidence level used to
  # build the SLR fingerprints. Not an SLR level: those are waterlevel_names below.
  slr_projection: "ssp245" # options: ssp126/ssp245/ssp585
  confidence_level: "medium" # options: low/medium
  coastrp_min_lat: -60  # exclude antarctic stations (no exposure)

  # MDT is ADDED to COAST-RP storm-tide levels, re-referencing them from local MSL to the
  # GOCO06s geoid (matching the DEM correction above); see prepare_boundary_conditions.py.
  mdt_correction:
    mdt_variable: "mdt"
    fallback_search_deg: 3.0

  # Return-period convention: RP lists (this one and every other RP list) are
  # plain ints (years); a single scalar RP key (validation.return_period) is the
  # "RP100" wildcard form, as are the return_period columns of every output CSV.
  return_periods:
    # - 1
    - 2
    - 5
    - 10
    - 25
    - 50
    - 100
    - 250
    - 500
    - 1000

  waterlevel_names: # SLR levels "SLR_<mm>" = the waterlevel_name wildcard values
    - "SLR_0"
    - "SLR_500"
    - "SLR_1000"
    - "SLR_1500"
    - "SLR_2000"

  station_search_buffer_deg: 1.0 # buffer (deg) around a tile's bbox to search for COAST-RP stations
  station_search_min_size_deg: 2.0 # min search-box width/height (deg), centred on the tile; the box
  # used is the larger of this and bbox + station_search_buffer_deg per dimension. Unvalidated estimate
  connectivity_resolution_m: 500 # coarse cell size (m) of the ocean-connectivity station filter
  connectivity_water_fraction_threshold: 0.5 # min ocean fraction (mask==1 only) of a coarse cell's
  # native pixels for it to count as water in that filter
  nc_filename_template: "COAST-RP_EWL_{return_period}_{waterlevel_name}.nc"
  nc_variable_template: "COAST-RP_EWL_{return_period}_{waterlevel_name}"
  station_x_var: "station_x_coordinate"
  station_y_var: "station_y_coordinate"

  # Not implemented: hop>=1 tiles drawing extra virtual stations from a lower-hop neighbour's
  # simulated wet cells in the overlap. Needs the neighbour's results, so it must run after that
  # neighbour; a precompute from frozen geometry was rejected (overlaps span up to hundreds of km).
  # boundaries.sample_waterlevel_at_points is the point-lookup primitive for it.

# ── RASTER FORMAT ──────────────────────────────────────────────────────────────
raster_format:
  driver: "GTiff"
  compression: "zstd"
  predictor: 3
  nodata: -9999


# ── FLOOD SIMULATION ──────────────────────────────────────────────────────────
simulation: # Used by: preprocessing rules
  model_outputs: "{root}/model_outputs"  # per-tile "{tile_id}/inputs" and "{tile_id}/results"
  preprocessing_inputs_dir: null # when set, per-tile preprocessing inputs are read/written there instead of model_outputs

  # Solver: src/flood_model.py flood_depth_dense (round-based, capped at flooding.max_rounds).
  model_bbox_buffer_arcsec: 3 # buffer around the tile bbox to ensure a thin strip of ocean
  dem_gap_fill: # missing-land DEM cells: large 4-connected gaps are hard-filled, the rest IDW-interpolated
    min_hard_fill_component_size: 15 # gaps larger than this (cells) are hard-filled to land_fill_value_m
    interp_max_search_distance: 100
    interp_smoothing_iterations: 0
    # Elevation (m) for hard-filled gaps: above DeltaDTM's <=30 m envelope (never floods) yet
    # within the int16-centimetre DEM encoding (src/rasters.py DEM_SCALE); 9999 m would overflow.
    land_fill_value_m: 99

  flooding:
    resolution: 30       # output raster resolution in metres
    knn: 15              # number of nearest water level stations used
    # Default Manning's n roughness (÷ 100) for cells with no land use class.
    default_friction: 0.002
    # Runtime multiplier on the decoded friction raster (n/100), not baked into compute_friction.py.
    # Not a free tuning knob: friction is a per-metre rate but src/eikonal.py uses it as the cost
    # of one grid step, so ~30 (DeltaDTM grid step in m) is a required unit correction and 1 is
    # wrong. 12.0 = 30 x 0.4 calibration against SFINCS (1000 tiles: CSI 0.743, bias 1.05 vs
    # CSI 0.732, bias 1.21 at 9.0). See docs/methods_02_flood_depth.md §2.1.
    friction_scale_factor: 12.0

    # Max rounds (4 directional sweeps each, early exit on convergence) per solve, also per inner
    # solve under obstacle_coupling. 40: sweep-budget study (docs/methods_03_calibration_sensitivity.md
    # §2): 58.5% of tiles converge by round 40, and 97.8% of the rest have a frozen flood extent.
    # The fixed 3-sweep mode stays available via flood_depth_dense's `sweep_budget`.
    max_rounds: 40

    # Early-exit threshold (m) on a round's max per-cell waterlevel change; well below the 0.1 m
    # flood/no-flood threshold (see flood_model.WATERLEVEL_EPSILON_M).
    waterlevel_epsilon_m: 0.03

    # Blocks friction-cheap shortcuts through terrain higher than the attenuated water level
    # (Kasmalkar et al. 2024 "Flow-Tub" critique) by setting friction -> 9999 and re-solving in an
    # outer loop; algorithm in flood_model.flood_depth_dense.
    obstacle_coupling:
      enabled: true
      # 4: obstacle-coupling study (docs/methods_03_calibration_sensitivity.md §3), with blocked cells
      # accumulated across iterations: 500/500 tiles converge within 4 (370 at 2, 123 at 3, 7 at 4).
      # Counts inner solves; a tile stopping at solve k has k-1 blocking rounds in its output.
      max_outer_iterations: 4
      outer_convergence_pct: 0.01  # stop early once < this % of the tile's cells are newly blocked in an outer iteration

  # Peak-memory estimate for run_eikonal's `resources: mem_mb` (eikonal_runner.estimate_eikonal_mem_mb).
  # Calibrated on 7 tiles, deliberately generous; retune from production telemetry.
  eikonal_mem_estimate:
    base_mb: 1000
    bytes_per_pixel: 80

# ── HPC DISPATCH ────────────────────────────────────────────────────────────────
# Used by: rule generate_eikonal_jobs (rules/hpc_dispatch.smk) / scripts/generate_eikonal_jobs.py.
# A hop_distance>=1 tile is seeded from a lower-hop neighbour's output, so tiles are grouped by
# wave, then split into node batches; submit_waves.sh submits each wave with a SLURM
# `--dependency=afterany` barrier on all prior waves. See docs/hpc.md.
# `sbatch` is shared by simulation and preprocessing batching; for preprocessing its
# cpus_per_task is also the `snakemake --cores` value (1 = fully serial).
hpc:
  n_nodes: 40                                        # shared budget across
  # every batch per wave, split evenly by tile count
  jobs_dir: "{root}/model_outputs/hpc_jobs"           # generated sbatch scripts, resolved_config.yml, submit_waves.sh, logs/
  single_preprocess_job: false # true: generate_hpc_preprocess_job.py writes one job for all tiles instead of node batches
  # Site SLURM values (partition, mem, env_activate_cmd, wave_tiers, *_sbatch) are left empty here:
  # they come from config_hpc.yml (copy config_hpc.example.yml), which the HPC generators require.
  sbatch:
    partition: ""                                     # "" omits #SBATCH --partition (cluster default)
    account: ""                                       # optional; "" omits #SBATCH --account
    # days-hours:minutes:seconds. Mandatory: the cluster may default an unset time to 1 minute and kill the job.
    time: "1-00:00:00"
    mem: ""
    # Simulation: tiles solved concurrently per node (single-threaded numba solves).
    # Preprocessing: `snakemake --cores` for the batch.
    cpus_per_task: 1
    env_activate_cmd: ""                              # shell line activating the gfm env in every job

  # Per-hop_distance-wave node/partition tiers; override n_nodes/sbatch above, read only by
  # generate_hpc_simulation_jobs.py (not hpc_dispatch.smk). First tier whose `hops` contains the
  # wave's hop_distance wins; `n_nodes: null` = one node per tile; `hops: null` is the catch-all
  # and MUST be last. Each tier sets n_nodes, partition, cpus_per_task, mem and time.
  # Empty: every wave uses n_nodes/sbatch.
  wave_tiers: []

  # Resources of the SFINCS calibration jobs (sfincs_tiles/generate_calibration_jobs.py; --time is
  # computed per job) and of the flood-totals + plots job (generate_hpc_flood_totals_and_plots_job.py,
  # cpus_per_task is also its --workers). Empty/null values fall back to hpc.sbatch.
  calibration_sbatch:
    partition: ""
    cpus_per_task: null
    mem: ""
  flood_totals_sbatch:
    partition: ""
    cpus_per_task: null
    mem: ""

# ── POSTPROCESSING ────────────────────────────────────────────────────────────
# Used by: merge_chunk.py, compute_flood_fraction_chunk.py, build_mosaic_vrt.py,
#          plot_merged_results.py.

postprocessing:
  # Root directory for combined (multi-tile) rasters, VRTs and plots.
  merged_outputs: "{root}/merged_results"
  chunk_size_deg: 5 # spatial chunk size (degrees) for merging
  block_size: 2048 # side length (pixels) of the write blocks inside each chunk

  plots:
    enabled: true # to plot merged maps (plot_merged_results)

    dpi: 300
    merged_resolution_arcsec: 120  # 120" ≈ 3.7 km at the equator
    waterdepth_cmap: "Blues"
    waterdepth_vmax_m: 10
    merged_map_figsize: [10, 10] # for plot_merged_results


# ── COASTAL PROTECTION BASELINE ────────────────────────────────────────────────
protection: # Used by: analysis/compute_exposure_analysis.py
  baseline_waterlevel_name: "SLR_0" # SLR level at which the protection standard holds
  default_rp: 5 # minimum protection level assumed where no FLOPROS protection standards are available

exposure: # Used by: scripts/prepare_exposure_grid_chunk.py
  exceedance_threshold_m: 0.10 # Minimum flood depth (m) for a fine pixel to count as "flooded"


# ── ADAPTATION MEASURES ────────────────────────────────────────────────────────
adaptation: # Used by: analysis/compute_exposure_analysis.py
  slr_intensities: # SLR amount the measures are designed for
    - "SLR_500"
    - "SLR_1000"
    # - "SLR_1500"   # dropped: beyond the 2100 SLR range (median <= 0.72 m, p83 ~1 m), so it never tips

# ── POPULATION GROWTH (SSP SCENARIOS) ─────────────────────────────────────────
population_growth: # Used by: analysis/compute_exposure_analysis.py
  ssps:
    - SSP1
    - SSP2
    # - SSP3
    - SSP5
  # Output years (5-year grid of the IIASA projections; intermediate years linearly interpolated).
  output_years:
    - 2025
    - 2030
    - 2035
    - 2040
    - 2045
    - 2050
    - 2055
    - 2060
    - 2065
    - 2070
    - 2075
    - 2080
    - 2085
    - 2090
    - 2095
    - 2100

# ── ANALYSIS PIPELINE SWITCHES ────────────────────────────────────────────────
analysis: # Used by: analysis/run_analysis.py
  compute_exposure:      true   # baseline / protect / retreat / avoid / protect_avoid EAI CSVs
  compute_flood_totals:  true   # per-country flooded area/exposed population per (RP, SLR), no
  # protection/adaptation; read by validate_country.py (validation.flood_totals_dir)
  plot_burning_ember:    true   # impact-matrix (SLR × growth) figures
  plot_timeseries:       false  # EAI along SSP SLR trajectories to 2100;
                                # superseded by plot_extended_pathways' continent time series
  plot_tipping_points:   true   # tipping-point figure (visualization.tipping_points)
  plot_extended_pathways: true  # continent time series to 2150 (visualization.extended_pathways)
  plot_slr_vs_population: true  # SLR vs population decomposition: waterfalls + scatter (visualization.slr_vs_population)
  # All figures are written to visualization.output_dir directly (no subdirectories).
  plot_world_maps:       false  # world choropleth maps (slow for global runs)



# ── VISUALISATION ─────────────────────────────────────────────────────────────
visualization:
  output_dir: "{root}/figures"

  # ── Burning-ember ────────────────────────────────────────
  # The growth matrices span a wider space than the ember figures show, so pathways can be
  # followed beyond the SSPs (Nigeria SSP2 reaches +239 % by 2100) and beyond 2100 (AR6
  # SSP5-8.5 p83 passes 1.5 m before 2150; plot_extended_pathways.py).
  growth_rates: # relative to baseline year (2020)
    min: -0.7   # China/Japan population-decline variants reach about -62 % by 2150
    max:  3.5   # Nigeria SSP2 + continued trend reaches about +343 % by 2150
    step:  0.1

  slr_interp: # SLR axis interpolated between the modelled levels to smooth the curves
    min_mm:   0
    max_mm: 2000   # highest modelled SLR level (boundary_conditions.waterlevel_names)
    n_points: 133  # ~15 mm spacing

  ember_display: # plot_burning_ember.py: window of the growth matrix shown in the ember figures
    slr_max_mm: 1500
    growth_min: -0.5
    growth_max:  1.5

  highlight_years: [2050, 2100]

  country_eai_vmax: 1000000 # Fixed y-axis / colour-scale cap (EAI, people)

  burning_ember_figures: # plot_burning_ember.py: which figures to write
    country_set: true     # burning_ember_country_set_baseline.png (ember_country_set, with extended SSP pathways)
    top_countries: false  # burning_ember_top{n}_baseline.png (top_countries_ember)
    selection: false      # burning_ember_selection_baseline.png (ember_country_selection)
    per_scenario: false   # global + per-country ember per strategy/intensity (~200 x 7 figures, slow)

  top_countries_ember: # plot_burning_ember.py: grid of no-adaptation ember panels for the n countries
    n: 12              # with the highest EAI at rank_slr_mm SLR and today's population
    rank_slr_mm: 1400
    ncols: 4
    vmax: 10000000     # shared linear colour scale 0..vmax (people/yr); higher values saturate
    ssp_pathways: false # true: overlay each SSP-RCP's pathway (median SLR x national SSP population) per panel

  ember_country_set: # plot_burning_ember.py: no-adaptation ember panels for a hand-picked set, with each SSP-RCP
    # (extended_pathways.ssps) pathway to 2100 and its population-variant branches to extended_pathways.to_year
    countries: [CHN, IDN, BGD, USA, NGA, EGY, BRA, JPN, NLD] # NLD: highest non-Asian EAI after USA/NGA/EGY/BRA
    ncols: 3
    vmax: 10000000     # shared linear colour scale 0..vmax (people/yr), as top_countries_ember
    display: {slr_max_mm: 1500, growth_min: -0.7, growth_max: 3.5} # matrix part shown (pathways -62 to +343 %)

  ember_country_selection: # plot_burning_ember.py: no-adaptation ember panels for hand-picked countries of
    # similar EAI magnitude (max 1-2.5 M at 1.5 m SLR / +150 %), one shared colorbar, ordered from the
    # earliest response to SLR to the latest threshold (SLR at which 20 % of the 0-1.5 m rise is reached):
    countries: [MOZ, CMR, FRA, COL, PRK, ITA, KOR, MEX, GBR, TWN, PAK, RUS]
    ncols: 4
    n_contours: 5          # labelled contour lines, evenly spaced up to the shared colour-scale maximum

  timeseries_overview: # plot_timeseries.py: all continents in one figure (continent/timeseries_continents_overview.png)
    ssps: [SSP2, SSP5]   # one column per SSP; one row per continent, sorted by no-adaptation EAI in 2100

  extended_pathways: # plot_extended_pathways.py: SSP pathways continued beyond 2100 through the growth matrices
    to_year: 2150      # AR6 SLR trajectories run to 2150; population after 2100 follows the variants below
    ssps: [SSP2, SSP5]
    variants:          # illustrative population continuations from each country's 2100 SSP level (assumptions)
      stabilise: {mode: constant, label: "stabilized"}                           # hold the 2100 level
      trend:     {mode: trend, window: 25, half_life: 50, label: "continue trend"} # 2075-2100 rate, halving every 50 yr
      decline:   {mode: rate, annual: -0.005, label: "slow decline"}             # -0.5 %/yr
    strategies: [baseline, protect_SLR_500, avoid_SLR_500, retreat_SLR_500, protect_avoid_SLR_500] # growth-matrix
                       # labels in the continent time series (timeseries_extended_continents.png); missing files skipped
    ember: false       # true: also ember_extended_pathways.png for ember_countries (superseded by ember_country_set)
    ember_countries: [NGA, EGY, IND, CHN, JPN, USA]

  slr_vs_population: # plot_slr_vs_population.py: no-adaptation EAI change since 2020 split into SLR alone,
    # population alone and their interaction (waterfalls 2100 and extended_pathways.to_year; scatter 2100)
    ssps: [SSP2, SSP5]
    waterfall_n: 20             # countries with the highest EAI in 2100
    scatter_min_change: 100000  # scatter shows countries whose EAI changes by at least this many people/yr
    scatter_labels: 18          # name the n countries with the highest EAI in 2100

  tipping_points: # plot_tipping_points.py: when does a country's EAI exceed a fixed number of people?
    to_year: 2150                 # beyond 2100: population follows extended_pathways.variants (first = reference)
    ssps: [SSP2, SSP5]
    countries: [NGA, EGY, THA]    # all strategies tip by 2100 (at the p83 SLR end): growth-driven,
                                  # delta, and SLR-driven with a shrinking population
    eai_threshold: 500000         # people per year
    per_country_eai_threshold: {EGY: 250000} # optional overrides
    design_intensity: SLR_500     # adaptation design the strategies' isolines use; SLR_1000 is not exceeded
                                  # by 2100 (median SLR <= 0.72 m), so adaptation would never tip
    strategies: [baseline, avoid, protect, retreat, protect_avoid] # rows B, A, P, R, P + A; missing files skipped

  # ── SSP SLR trajectory CSV ────────────────────────────────────────────────
  slr_trajectories_csv: "{processed_inputs_dir}/slr_trajectories_global_median.csv"

  # ── Country population (analysis/extract_country_population.py) ───────────
  country_population_csv: "{processed_inputs_dir}/country_population_2020.csv" # WorldPop totals per ISO
  population_extract_row_band_deg: 5.0 # latitude band height (deg) per WorldPop read

  # ── Chart aesthetics ──────────────────────────────────────────────────────
  dpi: 200
  cmap_ember: "YlOrRd"
  n_ember_contours: 6 # labelled EAI contour lines on the burning-ember heatmap

  # ── Figure sizes (inches) ─────────────────────────────────────────────────
  ember_figsize: [8, 7]
  world_map_figsize: [14, 7]

  # ── World map ──────────────────────────────────────────────────────────────
  world_map_lat_range: [-60, 85] # (min_lat, max_lat)
  world_map_downsample: 4 # read every Nth geogunit_109 pixel row/col
  geo109_subsample: 10 # read every Nth pixel when building the geogunit_109 -> ISO lookup (one-time)

  # ── SSP–RCP pairings ─────────────────────────────────────────────────────
  ssp_rcp_codes:
    SSP1: 126
    SSP2: 245
    SSP5: 585

  ssp_colors:
    SSP1: "#1f77b4"
    SSP2: "#2ca02c"
    # SSP3: "#ff7f0e"
    SSP5: "#d62728"

  measure_colors:
    baseline: "#7f7f7f"
    protect:  "#1f77b4"
    retreat:  "#9467bd"
    avoid:    "#2ca02c"
    protect_avoid: "#17becf"

  level_linestyles: ["--", ":", "-."] # plot_timeseries.py
  baseline_linestyle: "-" # plot_timeseries.py

# ── COASTAL FLOOD-EXTENT VALIDATION ─────────────────────────────────────────────
# Used by: validation/validate_country.py, validation/run_validation.py.
# See docs/methods_04b_MapsValidation.md.
validation:
  benchmark_catalog: "snakemake_workflow/config/data_catalog_validation.yml"
  benchmark_root: "{root}/inputs/validation" # NOT the GFM catalog's own {root}
  output_dir: "{root}/validation"
  return_period: "RP100" # scalar RP: "RP100" wildcard form (see boundary_conditions.return_periods)
  waterlevel_name: "SLR_0"
  primary_threshold_m: 0.01 # model wet-cell depth threshold for scoring. Deliberately not
  # exposure.exceedance_threshold_m (0.10, damage accounting): CSI/HR improve monotonically down
  # to 0.01 m (Wales/Scotland test, 0.10/0.05/0.01 m), and the benchmarks are binary extents
  coastline_tolerance_cells: 1 # dilation radius (30 m model pixels) of the DIAGNOSTIC CSI_tol/HR_tol/
  # FAR_tol, reported next to the strict scores. 1 cell matches the measured registration scale
  # (datum shift ~2 m, DeltaDTM mask ~25-31 m); do not raise without a measured reason, and read
  # it with pct_disagreement_forgiven (see validation.confusion_counts_tolerant)
  benchmark_supersample: 5 # rasterisation supersampling factor per model pixel
  benchmark_wet_fraction: 0.5 # DISPLAY ONLY: wet cutoff for the agreement-map categories. Scoring
  # (validation.confusion_counts_soft) weights by the coverage fraction instead of thresholding,
  # since the optimal threshold differs by benchmark
  permanent_water_source: "deltadtm_mask" # data_catalog_gfm.yml key; DeltaDTM's ~25-31 m mask, finer
  # than Copernicus land_use (~100 m): coastal-strip masking loss within 240 m of shore 45.7% -> 30.1%.
  # The remainder is a waterline-definition mismatch (methods_04b_MapsValidation.md caveats)
  permanent_water_codes: [1, 2, 3] # DeltaDTM mask codes excluded (1=ocean, 2=lake, 3=river;
  # 0=land, 255=nodata). Copernicus land_use would need [80, 200]: change both keys together
  geogunit_source: "geogunit_protection_units" # data_catalog_gfm.yml key (WRI geogunit_107); used
  # only by validate_country_national_coverage to clip a region bbox to the country's own cells, so
  # neighbouring-country flooding is not scored as false positive
  iso_lookup_source: "flopros_protection_standards" # data_catalog_gfm.yml key - geogunit_107-ID-indexed, "ISO" column
  flood_totals_dir: "{root}/merged_results/exposure/flood_totals" # flood_totals_{ISO}.csv from
  # analysis/compute_flood_totals.py, read for model_total_wet_km2. Must match run_analysis.py's
  # exposure output dir + "/flood_totals" if its --out-dir is overridden
  plots:
    resolution_m: 200
    dpi: 300
    figsize: [10, 10]
    agreement_colors: # ColorBrewer Set1 - distinguishable under common colour-vision deficiencies
      agree: "#4daf4a" # green - both wet
      over:  "#e41a1c" # red   - model wet only
      under: "#377eb8" # blue  - benchmark wet only
