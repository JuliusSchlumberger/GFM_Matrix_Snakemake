# England hop-propagation test: a small, self-contained real cluster near The Wash estuary
# (Lincolnshire), hop_distance 0-5. Its grid and manifest are the 51 tiles of
# england_fine_tiles_all_england.gpkg lying wholly inside lon -0.1717..0.2529,
# lat 52.5678..53.0819 (EPSG:4326), renumbered 0-50 in all-England tile_id order; hop_distance
# recomputed for the subset equals the all-England value for every tile.
# Purpose: validate collect_neighbor_wave_seeds end-to-end for england_lidar_dem tiles - never
# exercised before (the Isles of Scilly test was all hop=0). Local-input only (no global
# counterpart needed - this test is about the hop mechanism, not a local-vs-global comparison).
# Scenario override layer on config.yml + config_local.yml (config_utils.materialize_config).

# Two-component SLR propagation adds the static level MDT + 2020 offset (boundaries.static_station_levels)
# in the GOCO06s frame to this ODN scenario's sea; it is kept, so a systematic overestimation here
# may come from that offset between the two datums (TODO.md).

tile_grid:
  path: "{processed_inputs_dir}/mask/validation/england_fine_tiles_wash_hop_test.gpkg"

paths:
  hydromt_data_catalog:
    - "snakemake_workflow/config/data_catalog_gfm.yml"
    - "snakemake_workflow/config/data_catalog_local_input.yml"

boundary_conditions:
  return_periods: [100]  # tests the hop seeding, one event is enough
  waterlevel_names: ["SLR_0"]
  stations_cache_dir: "{root}/england_hop_test/processed_inputs/WL_scenarios_cache"
  stations_cache_prebuilt: true  # preparation/cache_local_waterlevel_stations.py

adaptation:
  slr_intensities: []

simulation:
  dem_source_manifest: "{processed_inputs_dir}/mask/validation/england_fine_dem_source_manifest_wash_hop_test.csv"
  model_outputs: "{root}/england_hop_test/model_outputs"
  preprocessing_inputs_dir: null  # own per-tile inputs under model_outputs
postprocessing:
  merge_only: true  # validation run: the HPC postprocess chain merges only, no exposure / flood totals
  merged_outputs: "{root}/england_hop_test/merged_results"
visualization:
  output_dir: "{root}/england_hop_test/figures"
hpc:
  jobs_dir: "{root}/england_hop_test/model_outputs/hpc_jobs"
