# Global-deltas flood hazard maps, ssp126, RP100, all 5 SLR levels: 203 tiles covering 48 of 49
# deltas (preparation/build_delta_tile_subset.py). Volga (Id=44) has no tile: the Caspian is not
# ocean in DeltaDTM's mask, so there is no COAST-RP forcing. Fully isolated outputs and its own
# WL_scenarios (not shared with production or deltas_ssp245).

tile_grid:
  path: "{processed_inputs_dir}/mask/deltas_global_tiles.gpkg"

simulation:
  flooding:
    friction_scale_factor: 9.0  # computed with 9.0 (config.yml: 12.0)
  model_outputs: "{root}/deltas_floodmaps/ssp126/model_outputs"

postprocessing:
  merged_outputs: "{root}/deltas_floodmaps/ssp126/merged_results"

visualization:
  output_dir: "{root}/deltas_floodmaps/ssp126/figures"

boundary_conditions:
  slr_projection: "ssp126"
  waterlevel_nc_dir: "{root}/deltas_floodmaps/ssp126/WL_scenarios"
  return_periods: [100]

# Must be set: merged_waterlevel_names() unions it with waterlevel_names, so leaving it unset
# would add config.yml's adaptation SLR levels.
adaptation:
  slr_intensities: []

# Generate with generate_hpc_preprocess_job.py --calibration (the default path's wave dispatch
# uses production's base config), NOT --fuse: the tiles span several hop_distance waves.
hpc:
  n_nodes: 8
  # jobs_dir defaults to production's model_outputs/hpc_jobs; isolate it.
  jobs_dir: "{root}/deltas_floodmaps/ssp126/model_outputs/hpc_jobs"
