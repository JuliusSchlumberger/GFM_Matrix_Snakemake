# Benchmark flood-hazard maps for validation. Relative `path:` entries are resolved
# against config["validation"]["benchmark_root"], passed explicitly by
# config_utils.get_data_catalog (separate catalog because of that root).
#
# Per-benchmark rules (country_iso, geogunit_ids, hazard_type, variable, coverage,
# attribute_filter, regions, comparison_return_periods) are read from `meta` by
# validation.load_benchmark_spec, so a new benchmark is a catalog entry, not code.
# Field reference: docs/methods_04b_MapsValidation.md. Targets: Wales, Scotland,
# England (GBR) and New Brunswick (CAN); SF Bay has no entry (validate_sf_bay.py).
#
# country_iso selects the benchmarks for a country; territory masking uses
# geogunit_ids (WRI geogunit_107: England 3364, N. Ireland 3365, Scotland 3366,
# Wales 3367, New Brunswick 492, sampled from geogunit_107_all.nc), because GBR and
# CAN alone would include the whole country. Regions are EPSG:4326 bboxes; nested
# regions (e.g. severn_estuary inside wales) are scored twice and must not be summed.

wales_nrw_floodzone_seas:
  data_type: GeoDataFrame
  driver: vector
  path: Wales/NRW_FLOODZONE_SEAS.shp
  crs: 27700
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Wales
    country_iso: GBR
    geogunit_ids: [3367]
    hazard_type: coastal
    return_period: 200   # Flood Zone 3: >= 0.5% AEP
    variable: extent
    coverage: national
    comparison_return_periods: [100, 250]   # ~200 yr bracketed by native model RPs
    attribute_filter: {risk: "Flood Zone 3"}
    regions:
      wales: [-5.45, 51.30, -2.55, 53.50]
      severn_estuary: [-3.09, 51.48, -2.88, 51.69]
      menai_strait: [-4.48, 53.05, -4.27, 53.26]
    description: >
      Natural Resources Wales "Flood Map for Planning: Sea Flood Zones"
      (NRW_FLOODZONE_SEAS), Flood Zone 3 (sea flooding >= 0.5% AEP, 1-in-200),
      30,743 polygons covering the Welsh coast. Flood Zone 2 (0.1-0.5% AEP) is a
      separate class, so the attribute filter keeps exactly the FZ3 extent.
    methodology: NRW national coastal flood modelling; zones include a climate-change
      allowance.
    known_caveats: >
      (1) ~200 yr benchmark against model RP100/RP250. (2) The zones include a
      climate-change allowance; the model is scored at SLR_0, which biases towards
      under-prediction. (3) Defences and wave run-up treatment not reviewed.
    source_author: Natural Resources Wales
    source_url: https://datamap.gov.wales/layers/inspire-nrw:NRW_FLOODZONE_SEAS
    source_access: OGC API / WFS download
    source_notes: >
      The repo has no fetch script; save the layer from the source as
      `Wales/NRW_FLOODZONE_SEAS.shp` (EPSG:27700).
    source_version: "2024-05-23 (last update)"
    date_retrieved: "2026-09-30"
    source_license: Open Government Licence v3.0; attribution "Contains Natural Resources
      Wales information (c) Natural Resources Wales and database right. Contains OS data
      (c) Crown copyright and database right."

scotland_sepa_coastal_m:
  data_type: GeoDataFrame
  driver: vector
  driver_kwargs: {layer: FRM_FH_COASTAL_EXTENT_M}
  path: Scotland/Data/FRM_Coastal_Flood_Hazard_Layers_v3_0.gdb
  crs: 27700
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Scotland
    country_iso: GBR
    geogunit_ids: [3366]
    hazard_type: coastal
    return_period: 200   # "Medium" likelihood, present day
    variable: extent
    coverage: national
    # No attribute_filter: the layer holds only PROB="M", SCENARIO="Present Day".
    comparison_return_periods: [100, 250]
    regions:
      scotland: [-8.35, 54.54, -0.70, 60.87]
      firth_of_forth: [-3.85, 55.96, -3.64, 56.17]
    description: >
      SEPA coastal flood hazard extent, Medium likelihood (200 yr), present day,
      Flood Risk Management (Scotland) Act 2009 maps v3.0, covering the Scottish
      coast. Likelihood bands per the dataset documentation: High 10 yr, Medium
      200 yr, Low 1000 yr, Medium + climate change (2080, high emissions) 200 yr.
    methodology: SEPA national/regional coastal flood modelling, v3.0 (issued 2025-02-25).
    known_caveats: >
      (1) ~200 yr benchmark against model RP100/RP250. (2) Defences and wave run-up
      treatment not reviewed. (3) Only the present-day Medium layer is catalogued;
      High, Low and Medium + CC layers are in the same geodatabase.
    source_author: Scottish Environment Protection Agency (SEPA)
    source_url: https://www.data.gov.uk/dataset/17637b84-e6ae-4ca0-98d9-83ab4a1997fd/coastal-flood-maps-frm-fh-coastal-extent-m401
    source_access: open download
    source_notes: >
      Download and unzip so that the file geodatabase sits at
      `Scotland/Data/FRM_Coastal_Flood_Hazard_Layers_v3_0.gdb`.
    source_version: v3_0
    date_retrieved: "2026-10-01"
    source_license: Open Government Licence v3.0 (SEPA attribution, see Guidance
      Documents/*Data Attribution Statement*.pdf)

# England: Environment Agency Flood Map for Planning, fetched tile by tile with
# validation/fetch_england_flood_zones.py, filtered to flood_source "sea" and
# "river and sea" (estuarine) and origin "modelled", split per flood zone.
england_ea_floodzone3_sea:
  data_type: GeoDataFrame
  driver: vector
  path: England/fz3_sea_modelled.gpkg
  crs: 4326
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: England
    country_iso: GBR
    geogunit_ids: [3364]
    hazard_type: coastal
    return_period: 200   # Flood Zone 3: >= 0.5% AEP
    variable: extent
    coverage: national
    comparison_return_periods: [100, 250]
    regions:
      england: [-6.37, 49.88, 1.77, 55.82]
    description: >
      Environment Agency "Flood Map for Planning" Flood Zone 3 (>= 0.5% AEP,
      1-in-200), sources "sea" and "river and sea", modelled origin, covering the
      English coast. Scored by validation/rescore_england_fz3.py.
    methodology: EA national coastal flood modelling.
    known_caveats: >
      (1) ~200 yr benchmark against model RP100/RP250. (2) Defences and wave run-up
      treatment not reviewed.
    source_author: Environment Agency
    source_url: https://environment.data.gov.uk/spatialdata/flood-map-for-planning-flood-zones/ogc/features/v1/collections/Flood_Zones_2_3_Rivers_and_Sea/items
    source_access: OGC API / WFS download
    source_notes: >
      `python validation/fetch_england_flood_zones.py` downloads and writes it (together
      with `fz2_sea_modelled.gpkg`).
    source_version: Flood Map for Planning, Flood Zones 2 and 3 (Rivers and Sea)
    date_retrieved: "2026-10-16"
    source_license: Open Government Licence v3.0 (Environment Agency / Defra attribution)

england_ea_floodzone2_sea:
  data_type: GeoDataFrame
  driver: vector
  path: England/fz2_sea_modelled.gpkg
  crs: 4326
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: England
    country_iso: GBR
    geogunit_ids: [3364]
    hazard_type: coastal
    return_period: 1000   # outer edge of the band: 0.1% AEP
    variable: extent
    coverage: national
    comparison_return_periods: [1000]
    regions:
      england: [-6.37, 49.88, 1.77, 55.82]
    description: >
      Environment Agency "Flood Map for Planning" Flood Zone 2, sources "sea" and
      "river and sea", modelled origin: the incremental 0.1-0.5% AEP band
      (1-in-1000 to 1-in-200), not the cumulative 1-in-1000 extent.
      validation/validate_england_fz2_band.py scores it against the model's
      RP1000-minus-RP100 band.
    methodology: EA national coastal flood modelling.
    known_caveats: >
      (1) Comparing this band with the cumulative model RP1000 extent overstates
      bias; use validate_england_fz2_band.py. (2) Defences and wave run-up treatment
      not reviewed.
    source_author: Environment Agency
    source_url: https://environment.data.gov.uk/spatialdata/flood-map-for-planning-flood-zones/ogc/features/v1/collections/Flood_Zones_2_3_Rivers_and_Sea/items
    source_access: OGC API / WFS download
    source_notes: >
      `python validation/fetch_england_flood_zones.py` downloads and writes it (together
      with `fz3_sea_modelled.gpkg`).
    source_version: Flood Map for Planning, Flood Zones 2 and 3 (Rivers and Sea)
    date_retrieved: "2026-10-16"
    source_license: Open Government Licence v3.0 (Environment Agency / Defra attribution)

# New Brunswick: GeoNB flood extents (EPSG:2953, vertical datum CGVD2013), created
# 2025-03-21. Only PresentDay_1in100year is catalogued; PresentDay_1in20year,
# ClimateChange2100_1in20year/_1in100year and HHWLT_2100_polygon exist alongside.
# `gridcode` is an ArcGIS RasterToPolygon pixel value of unknown units, not a class.
new_brunswick_present_day_1in100yr:
  data_type: GeoDataFrame
  driver: vector
  path: NewBrunswick/PresentDay_1in100year.shp
  crs: 2953
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: New Brunswick
    country_iso: CAN
    geogunit_ids: [492]
    hazard_type: coastal   # combined inland + coastal; no attribute separates them
    return_period: 100
    variable: extent
    coverage: national
    # No attribute_filter: every row is benchmark-wet extent.
    regions:
      # Two disjoint estuaries at the upper Bay of Fundy, summed for the "ALL" row.
      # No whole-province region: its rasterize over the 784,805-feature file does
      # not finish (99.8 % of features fall in the province bbox).
      cumberland_basin: [-64.42, 45.85, -64.22, 46.05]
      petitcodiac: [-64.83, 45.92, -64.42, 46.13]
    description: >
      GeoNB present-day 1-in-100-year flood extent (combined inland and coastal),
      covering the New Brunswick coast and tidal rivers.
    methodology: ArcGIS RasterToPolygon conversion of GeoNB's flood hazard raster.
    known_caveats: >
      (1) Combined inland + coastal hazard; inland-only flooding is an expected
      mismatch. (2) Severe under-prediction at the Bay of Fundy head (CSI ~0.002):
      COAST-RP/GTSM does not resolve Fundy's tidal resonance (boundary levels cap
      at ~4.8 m). (3) Loading the file takes ~9 min (784,805 features).
      (4) Defences and wave run-up treatment not reviewed.
    source_author: Government of New Brunswick (GeoNB)
    source_url: https://www.gnb.ca/en/campaign/geonb/data-catalogue/flood-extent.html
    source_access: open download
    source_notes: >
      Download and unzip so that `PresentDay_1in100year.shp` and its sidecar files sit in
      `NewBrunswick/`.
    source_version: "2025-03-21"
    date_retrieved: "2026-10-01"
    source_license: GeoNB Open Data Licence
