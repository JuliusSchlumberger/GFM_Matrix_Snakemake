norway_stormflo_200ar:
  data_type: GeoDataFrame
  driver: vector
  driver_kwargs: {layer: stormflo200ar_klimaarna}
  path: NOR/stormflo200ar_klimaarna.gpkg
  crs: 25833                     # ETRS89 / UTM zone 33N - projected, unlike Spain (4258) and
                                  # France (4326); build_evaluation_clusters/benchmark_fraction_from_vector
                                  # reproject to the working CRS as needed, no extra handling required.
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Norway
    country_iso: NOR
    hazard_type: coastal
    return_period: 200            # real value ("F2"/TEK17 safety class 2, storm-surge recurring
                                   # ~1/200yr) - Norway has no 100yr layer (only 20/200/1000yr,
                                   # "sikkerhetsklasseflom" F1/F2/F3). Compared against the model's
                                   # RP100 anyway (user decision 2026-09) - a real, documented
                                   # return-period mismatch, same spirit as France's "02Moy" caveat.
    comparison_return_periods: [100, 250]   # 2026-10: the multi-RP summary
    # (validation/run_multi_rp_summary.py) scores Norway at both of the model's own NATIVE
    # return periods - RP100 (the global default every country gets) and RP250 (the model's
    # own nearest native scenario above Norway's real ~200yr benchmark class). An earlier
    # version of this also reported an interpolated RP200 point (log-linear interpolation
    # between the native RP100/RP250 merged chunks) to get the closest direct match to the
    # benchmark's own real-world return period - removed 2026-10 (user decision): report
    # performance at the model's own real, simulated return periods only, not an estimated
    # intermediate one.
    variable: extent
    coverage: national            # Kartverket assessed the ENTIRE Norwegian coastline (unlike
    # Spain/France's isolated designated survey zones) - confirmed via the dump's own
    # dekningsomrade (coverage) table: ikkeRelevant (inland, excluded) + kartlagtUtenFunn
    # (mapped, nothing found - real dry evidence) + grundigKartlagtMedFunn (thoroughly mapped
    # with findings) partition the whole country, no "unsurveyed" gap. Dispatches
    # validate_country.py to validate_country_national_coverage (per-postprocessing-chunk,
    # no buffer/cluster) instead of the cluster-based path - both because "outside the
    # polygon" is unambiguous here (a real dry result, not "never looked at"), and because
    # Norway's long, only-lightly-fragmented coastline collapses build_evaluation_clusters'
    # buffer+merge into one cluster spanning almost the whole country, which crashed the
    # cluster-based path's per-cluster bbox-sized array allocation (confirmed 2026-09: a
    # single cluster with bbox 27deg x 13.5deg triggered a 65.9 GiB allocation).
    # No attribute_filter: this GeoPackage (converted 2026-09 from Kartverket's real 26 GiB
    # PostGIS dump by preparation/convert_norway_stormflo.py) is ALREADY a single-scenario
    # extract - every one of its 115,440 rows has sikkerhetsklasseflom='F2' (confirmed).
    # NOT pre-filtered/subtracted for the sea: each raw polygon is "everything below water
    # level X", which includes the permanently-wet sea (confirmed 2026-09: 97.6-99.3% of raw
    # polygon area at sampled AOIs). This is NOT stripped at conversion time - it relies on
    # this pipeline's EXISTING Copernicus land-use permanent-water exclusion (the same
    # `not_water` masking already applied for Spain/France) instead, confirmed 2026-09 to
    # correctly classify 98.06% of the real sea area as permanent water even across Norway's
    # narrow fjords/island coastline (92.7-99.1% at every one of 5 sampled AOIs, including a
    # narrow fjord and an island maze) - see known_caveats for the corresponding land-side cost.
    regions:
      mainland: [4.0, 57.5, 31.5, 71.5]   # real data bounds (converted GeoPackage):
      # lon 4.28-31.35, lat 57.85-71.31 (Utsira to the Russian border, to North Cape) - no
      # overseas territories.
    description: >
      Kartverket (Norwegian Mapping Authority) official storm-surge hazard polygons,
      "sikkerhetsklasseflom" F2 (TEK17 safety class 2, ~200-year recurrence), scale 1:80,000.
      Source table stormflo200ar_klimaarna ("today's climate", as opposed to the same
      dataset's climaar2100/2150 projection tables, not used here).
    methodology: >
      Kartverket's own storm-surge model output, water level referenced to NN2000 (Norway's
      vertical datum), delineated onto Kartverket's own elevation data. Distributed as a
      PostGIS SQL dump (schema stormflohavniva_*), converted once to this GeoPackage by
      preparation/convert_norway_stormflo.py (not part of the regular Snakemake DAG - run
      manually/on-demand, like analysis/extract_country_population.py).
    source_url: https://kartkatalog.geonorge.no/metadata/stormflo-og-havnivaa/fbb95c67-623f-430a-9fa5-9cfcea8366b3
    date_retrieved: "2026-09-10"
    source_license: NLOD (Norwegian Licence for Open Government Data)
    source_version: "2026-09-06"   # dataset's own last-updated date per the Geonorge API
    known_caveats: >
      (1) Return-period mismatch: F2/~200yr compared against the model's RP100 - looser than
      even France's vague "02Moy", see return_period above. (2) Vertical datum: real measured
      NN2000->GOCO06s offset is -0.196 m mean (-0.334 to -0.006 m across Norway's latitude
      range, via Kartverket's own HREF2018B grid) - given Norway's coastline is steep enough
      that this translates to only ~2 m of horizontal boundary shift (~10 m displacement per
      1 m of water level, measured from Kartverket's own nested hazard layers), this is 7% of
      one DEM pixel and 50x below the vector_simplify_tolerance_m already accepted elsewhere -
      measured and deliberately NOT corrected for.
      (3) The SAME land-use masking that correctly excludes ~98% of the raw polygon's sea area
      also masks ~51% of the genuine thin land-inundation strip (Norway's actual flooded land
      is only ~0.2-2.1% of the raw polygon to begin with, and a coastal strip that narrow is
      finer than Copernicus' 100 m resolution) - not Norway-specific (measured 97.8% for
      Spain's own most-coastal feature too), but more consequential here given how thin
      Norway's real flood extent is; effective benchmark-wet area is roughly ~1% of raw
      polygon area. (4) Data-quality gap found in Bergen specifically: its four hazard layers
      (mean-high-water/20yr/200yr/1000yr) have inconsistent feature counts (24/34/57/47) and
      are not cleanly nested - real disagreement in Kartverket's own source data, unrelated to
      anything this pipeline does, large enough to dominate the datum signal there.

# -- Denmark (DEN) -------------------------------------------------------------
# Danish "Oversvommelsesfare" (flood hazard) national flood-depth rasters,
# downloaded 2026-09 from Statens IT's SFTP portal (see source_url). Two hazard
# categories: "Hav" (sea/coastal, 9 return periods) and "Vandlob" (watercourse/
# fluvial, 4 return periods) - only Hav is used (hazard_type: coastal; Vandlob
# would be fluvial, not downloaded/cataloged).
#
# RasterDataset, NOT GeoDataFrame - the first raster benchmark this pipeline
# supports (added 2026-09: BenchmarkSpec.wet_values/depth_threshold_m,
# src/validation.py::read_benchmark_raster_fraction, and a data_type dispatch in
# validate_country_national_coverage - GeoDataFrame benchmarks are unaffected).
# Original per-RP files (confirmed via each .tif.xml's own ArcGIS rename lineage,
# e.g. "H100_2023_dyb_5m.tif" - "dyb" = depth) are CONTINUOUS water depth in
# metres at 5m resolution, EPSG:25832 - not a categorical hazard-class raster, so
# `depth_threshold_m` (not `wet_values`) is used: any pixel with a real recorded
# depth above threshold counts as benchmark-wet, nodata (the vast majority of
# each file - real coastal flooding is a thin fringe within a national bounding
# box, same shape as Norway/Finland) counts as not-wet.
#
# NOTE ASCII-only path: the original folder/file names contain "ø"/"å"
# (Oversvømmelsesfare, hav/år) - hydromt's data_catalog reader opens this yml
# with the platform default encoding (cp1252 on Windows), which would silently
# mis-decode those bytes and break the actual file path used to open the
# raster (not just cosmetic mangling the way it is for meta text) - the
# RP100 file was renamed/moved to
# DNK/coastal/Oversvommelsesfare_hav_100ar.tif (ASCII transliteration) rather
# than referenced at its original location. Only RP100 was renamed - the other 8
# return periods (and all of Vandlob) are still at their original accented paths,
# unused by this catalog and untouched. The top-level folder itself was also
# renamed DEN -> DNK (2026-09, alongside the country_iso fix below) for
# consistency with every other country's folder matching its real ISO code.
#
# Scale/scope: RP100 only for now (matches every other country's convention);
# Denmark's return periods (10/20/50/100/200/500/1000/5000/10000) overlap GFM's
# own COAST-RP return periods more closely than any other country's benchmark so
# far (10/50/100/200~250/500/1000 all near-exact matches) - a real opportunity
# for a multi-RP comparison later, not built this session (validate_country.py's
# single global val_cfg['return_period'] would need per-benchmark RP-matching
# logic first, same open item already noted for Finland).
denmark_stormsurge_national:
  data_type: RasterDataset
  driver: raster
  path: DNK/coastal/Oversvommelsesfare_hav_100ar.tif
  crs: 25832   # ETRS89 / UTM zone 32N - projected, same handling as Norway (25833) and Finland (3067)
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Denmark
    country_iso: DNK   # real ISO 3166-1 alpha-3 code - confirmed 2026-09 against this
    # pipeline's own FLOPROS_NL_geogunit_107.xlsx ISO column ("DEN" is not a valid ISO-3
    # code at all, just a common sports/FIFA abbreviation - using it silently zeroed every
    # metric via read_country_mask finding no matching geogunit cells, not a crash)
    hazard_type: coastal
    return_period: 100   # real value - original filename "H100_2023_dyb_5m.tif" confirms RP100, 2023 vintage
    variable: extent
    coverage: national
    depth_threshold_m: 0.0   # any pixel with a real recorded depth (i.e. not nodata) counts as
    # benchmark-wet - the source's own hydraulic model already decided what "flooded" means at
    # 5m resolution; this pipeline doesn't re-threshold a deeper cutoff on top of that.
    regions:
      mainland: [7.82, 54.24, 15.78, 57.96]   # the Hav RP100 raster's own real bounds (EPSG:25832
      # 441585/6049785/893020/6402300) reprojected to 4326 with a small pad - same bbox-can-
      # overlap-a-neighbour caveat as Norway/Finland's own mainland regions (Denmark borders
      # Germany and faces Sweden/Norway across narrow straits) - validate_country_national_
      # coverage's read_country_mask step already handles this generically, no extra code needed.
    description: >
      Danish national coastal ("Hav") flood hazard depth raster, RP100, 5m resolution,
      continuous water depth in metres (not categorical) - covers the entire Danish
      coastline at fine resolution within one national bounding box.
    source_url: https://sftp.statens-it.dk/public/folder/sudeyofd-echpkegqfxhbg/Plantrin%201%20National%20data%202024
    date_retrieved: "2026-09-15"
    source_license: <to confirm - Danish state data portal terms, see the download portal>
    known_caveats: >
      (1) First raster benchmark in this pipeline - the comparison code (read_benchmark_raster_
      fraction) is new 2026-09, proven on this one real run, not battle-tested across many
      countries the way the vector path is. (2) Extent only (depth_threshold_m=0, i.e. "any
      recorded depth") - a genuine depth-vs-depth comparison is possible given this source's
      continuous values (unlike every other country's categorical/binary benchmark) but was not
      built this session - a real future opportunity, not a limitation of the source data itself.
      (3) Only RP100 wired in despite Denmark having the widest RP overlap with GFM's own
      COAST-RP scenarios of any country so far - see scope note above. (4) Defences / wave
      run-up not independently verified for this benchmark's methodology - same caution as
      every other country (Spain §2.1, France §2.2, Finland §2.4).

# -- Wales (part of GBR) -------------------------------------------------------
# Natural Resources Wales "NRW_FLOODZONE_SEAS" (coastal/tidal flood zones),
# downloaded 2026-09-30 via NRW's own WFS (datamap.gov.wales, see url.txt/
# wfsrequest.txt alongside the shapefile) - 30,743 features, ALL valid
# geometries (no buffer(0) repair needed, unlike France/Spain), EPSG:27700.
# Two nested risk classes ("Flood Zone 2" / "Flood Zone 3", the same
# EA/NRW-wide convention used across Great Britain) spanning Wales' entire
# coastal bounding box - this is a comprehensive national planning product,
# not a selectively-surveyed subset like Spain's ARPSI or France's TRI -
# coverage: national (same architecture as Norway/Denmark/Finland), NOT
# item 11's partial-coverage study-area path.
#
# country_iso is "GBR" (Wales has no ISO-3166-1 code of its own) - but
# read_country_mask's normal ISO-string lookup would then ALSO match
# England/Scotland/N.Ireland's own territory (all four share ISO "GBR" in
# the WRI geogunit_107 lookup table), wrongly scoring England's real
# coastline as a false positive against a benchmark that only ever covered
# Wales. Resolved 2026-09-30 via a real, sampled lookup (geogunit_107_all.nc,
# "Geogunits" variable, checked at Cardiff/Swansea vs London/Manchester/
# Edinburgh/Belfast): Wales is its own distinct geogunit_107 unit, ID 3367
# (England=3364, N.Ireland=3365, Scotland=3366) - see BenchmarkSpec.
# geogunit_ids (new field, validation.py) and read_country_mask's own
# geogunit_ids override, which bypasses the ISO lookup entirely when given.
wales_nrw_floodzone_seas:
  data_type: GeoDataFrame
  driver: vector
  path: Wales/NRW_FLOODZONE_SEAS.shp
  crs: 27700   # British National Grid
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Wales
    country_iso: GBR   # for benchmark-key discovery only (_find_benchmark_keys) - actual
    # territory masking uses geogunit_ids below, NOT an ISO-string match, since GBR alone
    # would include England/Scotland/N.Ireland too (see file-header comment above).
    geogunit_ids: [3367]   # WRI geogunit_107 unit ID for Wales specifically - see above.
    hazard_type: coastal
    return_period: 200   # real value - "Flood Zone 3" is NRW's undefended 0.5% AEP (1-in-200)
    # coastal extent, the closer analog to the model's RP100 of the two available classes
    # (Zone 2's own upper bound is the rarer 0.1% AEP / 1-in-1000 extent) - same convention
    # as Norway's F2/~200yr mismatch, see known_caveats.
    variable: extent
    coverage: national
    comparison_return_periods: [100, 250]   # same ~200yr-vs-native-RP100/RP250
    # mismatch as Norway/Scotland (return_period above) - report the model's own real,
    # simulated return periods only, not an estimated intermediate one.
    attribute_filter: {risk: "Flood Zone 3"}
    regions:
      wales: [-5.45, 51.30, -2.55, 53.50]   # real data bounds (EPSG:4326, from the
      # shapefile's own total_bounds) with a small pad - the "whole region" plotted
      # as the main map by plot_agreement_map.py (largest by pixel count).
      # 2026-10-01: re-enabled the comparison study's own two sub-areas alongside
      # the whole-Wales region above (not instead of it - same "whole country +
      # named sub-areas" pattern as Scotland's firth_of_forth and New Brunswick's
      # cumberland_basin/petitcodiac, each independently processed over its own
      # bbox by validate_country_national_coverage, so these rows are NOT a
      # disjoint partition of wales - severn_estuary/menai_strait cells are
      # scored twice, once under "wales" and once under their own name; do not
      # sum region rows for a country total here the way Spain's mainland +
      # canary_islands can be summed). Each region's bbox is the working read
      # extent, further masked to real Wales territory via geogunit_ids above -
      # menai_strait's latitude range as given by the user (53.05-53.06, ~1.1km)
      # was confirmed a typo for 53.05-53.26 (matches the strait's real ~21km
      # extent). plot_agreement_map.py's own companion `plot_subregions_grid`
      # output (`agreement_GBR_subregions_{RP}_{SLR}.png`) renders these two as
      # full-size panels, separate from the main whole-Wales map.
      severn_estuary: [-3.09, 51.48, -2.88, 51.69]
      menai_strait: [-4.48, 53.05, -4.27, 53.26]
    description: >
      Natural Resources Wales coastal/tidal flood zone polygons ("FLOODZONE_SEAS"),
      Flood Zone 3 (undefended, 0.5% AEP / 1-in-200 coastal), covering the entire Welsh
      coastline - the same national flood-zone-for-planning product used across Great
      Britain (England's Environment Agency publishes the equivalent EA layer).
    methodology: >
      NRW's own coastal flood modelling (methodology not independently reviewed here -
      see known_caveats), undefended extent at Flood Zone 3's 0.5% AEP threshold.
    source_url: https://datamap.gov.wales/layers/inspire-nrw:NRW_FLOODZONE_SEAS
    date_retrieved: "2026-09-30"
    source_license: <to confirm - Natural Resources Wales open data terms>
    known_caveats: >
      (1) Return-period mismatch: Zone 3's 0.5% AEP (~200yr) compared against the model's
      RP100, same spirit as Norway's F2 mismatch - see return_period above. (2) Whether
      NRW's Zone 2/Zone 3 polygons are nested (Zone 2 encloses Zone 3) or mutually
      exclusive adjacent bands was NOT independently verified against NRW's own published
      methodology this session - attribute_filter keeps Zone 3 only either way, which is
      the correct choice under either interpretation (the higher-probability/more-frequent
      class). (3) country_iso="GBR" + geogunit_ids=[3367] is a new mechanism (this
      benchmark is the first sub-national-only national-coverage entry in this catalog) -
      see the file-header comment for how it was derived and verified. (4) Defences / wave
      run-up not independently verified for this benchmark's methodology - same caution as
      every other country (Spain §2.1, France §2.2, Finland §2.4, Norway §2.3).

# -- Finland (FIN) -------------------------------------------------------------
# SYKE (Finnish Environment Institute) tulvavaaravyohykkeet - perusskenaariot
# (flood hazard zones - basic scenarios), sea/coastal ("meri") flooding, downloaded
# 2026-09 from https://ckan.ymparisto.fi/dataset/tulvavaaravyohykkeet-perusskenaariot-
# flood-hazard-zones-basic-scenarios.
#
# Single GeoPackage, 20.3 GB, 8 named sub-areas ("kohde") x 8 return-period layers
# (each ~4-5.6M features - a very fine lidar-derived grid-cell mesh, NOT dissolved
# zones). Real investigation 2026-09 found kohdenro=133 ("Rannikkoalueen
# meritulvakartta" - "coastal area sea flood map") alone spans nearly the entire
# Finnish coast (40,258 km2 bbox, ~3.8M of the ~4.0M total RP100 features) and
# genuinely spatially overlaps the other 7 named sub-areas (confirmed via a real
# rtree-index bbox query, e.g. Naantali's own small bbox contains BOTH kohdenro=76's
# own 1178 detailed features AND 347 of kohdenro=133's own features covering the same
# ground) - the 7 smaller city-scale maps (Naantali/Hamina-Kotka/Rauma/Loviisa/
# Helsinki-Espoo/Turku-Raisio/Kemi) are more detailed LOCAL alternatives, not
# additional un-covered ground, so this pipeline uses kohdenro=133 only
# (coverage: national, same architecture as Norway - see caveats doc). Loading a
# 3.8M-feature single benchmark fully into memory (what load_benchmark_full/
# validate_country_national_coverage both do today) is untested at this scale -
# flagged as an open risk in the caveats doc, not resolved by this catalog wiring.
#
# Depth classification (`syvvyohluokka_id`, joined via domainmaartlvsyvyystaulu in
# the source - not re-derived here, English values written directly): 0=dry land
# (excluded), 1-5=depth bands 0-0.5/0.5-1/1-2/2-3/>3m, 99=permanent water body
# (excluded - explicit in the source data, unlike Norway where this had to be
# inferred from an external land-use mask). Filtering is pushed down to the GDAL/
# SQLite read itself via `driver_kwargs.where` (confirmed working 2026-09: a real
# `kohdenro=100 AND syvvyohluokka_id IN (1,2,3,4,5)` read returned 50,451 features
# in 13.6s directly from the 20 GB file - no separate conversion/preprocessing file
# needed).
#
# `variable: extent` only (not depth) for now - coverage=national depth-band
# comparison has no chunk-based code path yet (validate_country_depth_bands raises
# NotImplementedError for any non-partial-coverage benchmark by design - see its own
# docstring); would need genuinely new code mirroring validate_country_national_
# coverage's chunk-streaming architecture for depth bands specifically. Not built
# this session - flagged as a known gap.
finland_stormsurge_national:
  data_type: GeoDataFrame
  driver: vector
  driver_kwargs:
    layer: maartlvmeri0100syv
    where: "kohdenro=133 AND syvvyohluokka_id IN (1,2,3,4,5)"
  path: FIN/tulvavaaravyohykkeet_meri.gpkg
  crs: 3067   # ETRS89 / TM35FIN - projected, same handling as Norway's 25833
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Finland
    country_iso: FIN
    hazard_type: coastal
    return_period: 100   # real value - toistuvuus=100 confirmed directly against the
    # source layer (layer name maartlvmeri0100syv, attribute toistuvuus all =100)
    variable: extent
    coverage: national
    regions:
      mainland: [17.3, 59.3, 28.3, 66.2]   # kohdenro=133's own real bounds (EPSG:3067
      # 65000/6624000/548000/7314000) reprojected to 4326 with a small pad - same
      # bbox-can-overlap-a-neighbour caveat as Norway's mainland region (Finland
      # borders Sweden/Norway/Russia and the Gulf of Finland faces Estonia) -
      # validate_country_national_coverage's own country-mask step (read_country_mask)
      # already handles this generically, no extra code needed.
    description: >
      SYKE sea/coastal flood hazard zone polygons (kohdenro=133, "Rannikkoalueen
      meritulvakartta"), RP100 basic scenario, covering essentially the entire
      Finnish coastline at fine (lidar-grid) resolution. Extent-only (union of
      depth classes 1-5) - see known_caveats for the depth-band gap and the
      unused, more-detailed 7 city-scale sub-maps this pipeline does not read.
    source_url: https://ckan.ymparisto.fi/dataset/tulvavaaravyohykkeet-perusskenaariot-flood-hazard-zones-basic-scenarios
    date_retrieved: "2026-09-15"
    source_license: <to confirm - SYKE/ymparisto.fi open data terms, see the download portal>
    known_caveats: >
      (1) National coverage assumed, not independently confirmed beyond kohdenro=133's
      own bbox/feature-count dominance - see the file-header comment above for the real
      overlap check performed. (2) No depth-band comparison yet (extent only) - the
      chunk-based national-coverage path this benchmark requires has no depth-band
      implementation (validate_country_depth_bands is partial-coverage-only by design).
      (3) Defences are explicit and precisely quantifiable here (unlike every other
      country so far, where this has been an open, unmeasured caveat): at RP100,
      12.57 km2 of kohdenro=133's raw wet area (1573.75 km2, 0.80%) is reclassified as
      "protected by fixed structures" (syvsuojluokka_id=12) when Finland's own real
      flood defenses are accounted for - not applied to this comparison (this pipeline
      compares raw, undefended extent, same convention as every other country), but now
      a real measured number instead of an unknown risk. (4) The 7 detailed city-scale
      sub-maps (kohdenro 76/97/98/100/101/145 + Naantali) are NOT read by this catalog
      entry (see file-header comment) - if their local detail ever matters more than
      kohdenro=133's coarser coverage for a specific city, they are a real, already-
      identified upgrade path, not a data gap.

# -- Scotland (part of GBR) -----------------------------------------------------
# SEPA (Scottish Environment Protection Agency) "FRM_Coastal_Flood_Hazard_Layers_v3_0"
# File Geodatabase, downloaded from data.gov.uk (see url.txt) - Flood Risk Management
# (Scotland) Act 2009 statutory coastal flood hazard maps, issued 2025-02-25. 9 layers
# (EXTENT/DEPTH x H/M/L/M_CC); EXTENT_* layers are small (16-17 MultiPolygon features
# each, one per SEPA mapping region, all homogeneous attributes - no attribute_filter
# needed, same "already pre-split per file" pattern as Finland/Wales). Probability
# bands confirmed 2026-10-01 directly from "Coastal Flood Map v3.0 - Dataset
# Documentation.pdf" (Guidance Documents/, extracted via pdftotext): High=10yr,
# Medium=200yr, Low=1000yr, Medium+Climate Change(2080,high emissions)=200yr. Medium
# (EXTENT_M, present-day) is used here as the closest analog to the model's RP100 -
# same convention/mismatch as Wales' Zone 3 (~200yr) and Norway's F2 (~200yr).
#
# country_iso is "GBR" (Scotland has no ISO-3166-1 code of its own) - same mechanism
# as Wales (see that entry's header comment): geogunit_ids=[3366] (Scotland's own WRI
# geogunit_107 unit, confirmed 2026-09-30 alongside Wales=3367/England=3364/
# N.Ireland=3365 via a real sampled raster lookup) bypasses the ISO lookup so England's
# real coastline is never wrongly scored against this Scotland-only benchmark.
scotland_sepa_coastal_m:
  data_type: GeoDataFrame
  driver: vector
  driver_kwargs: {layer: FRM_FH_COASTAL_EXTENT_M}
  path: Scotland/Data/FRM_Coastal_Flood_Hazard_Layers_v3_0.gdb
  crs: 27700   # British National Grid, same as Wales
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Scotland
    country_iso: GBR   # for benchmark-key discovery only - actual territory masking
    # uses geogunit_ids below, NOT an ISO-string match (see file-header comment).
    geogunit_ids: [3366]   # WRI geogunit_107 unit ID for Scotland specifically.
    hazard_type: coastal
    return_period: 200   # real value - "Medium" likelihood, present-day scenario,
    # confirmed via the dataset's own documentation PDF (see file-header comment) -
    # same ~200yr mismatch-vs-RP100 convention as Wales/Norway.
    variable: extent
    coverage: national
    # No attribute_filter: this layer (FRM_FH_COASTAL_EXTENT_M) is already pre-split
    # to PROB="M"/SCENARIO="Present Day" throughout (confirmed 2026-10-01: all 16
    # rows share identical MAP_TYPE/SOURCE/METRIC/PROB/BAND_DESC/GRIDCODE/SCENARIO).
    comparison_return_periods: [100, 250]   # same ~200yr-vs-native-RP100/RP250
    # mismatch as Norway (return_period above) - report the model's own real,
    # simulated return periods only, not an estimated intermediate one (see
    # Norway's own comparison_return_periods comment).
    regions:
      scotland: [-8.35, 54.54, -0.70, 60.87]   # real data bounds (EPSG:27700
      # 54235/529747/470825/1220802, reprojected to 4326 with a small pad) - the
      # "whole region", plotted as the main map by plot_agreement_map.py.
      firth_of_forth: [-3.85, 55.96, -3.64, 56.17]   # user-specified real study area
      # (2026-10-01) - Firth of Forth estuary (Edinburgh/Fife coast). Nested inside
      # `scotland`'s own bbox, not disjoint from it (same pattern as Wales'
      # severn_estuary/menai_strait and New Brunswick's cumberland_basin/
      # petitcodiac) - firth_of_forth's cells are scored twice, once under each
      # region name; do not sum region rows for a country total here. Rendered as
      # its own full-size panel by plot_agreement_map.py's companion
      # `plot_subregions_grid` output, separate from the main whole-Scotland map.
    description: >
      SEPA national coastal flood hazard extent polygons, "Medium" probability of
      flooding (present-day scenario), Flood Risk Management (Scotland) Act 2009
      statutory product - covers the entire Scottish coastline.
    methodology: >
      SEPA's own national/regional/local-scale coastal flood modelling (methodology
      not independently reviewed here - see known_caveats), v3.0, issued 2025-02-25.
    source_url: https://www.data.gov.uk/dataset/17637b84-e6ae-4ca0-98d9-83ab4a1997fd/coastal-flood-maps-frm-fh-coastal-extent-m401
    date_retrieved: "2026-10-01"
    source_license: Open Government Licence 3.0 (SEPA attribution required - see
      Guidance Documents/*Data Attribution Statement*.pdf)
    source_version: "v3_0"
    known_caveats: >
      (1) Return-period mismatch: "Medium" (~200yr) compared against the model's
      RP100, same spirit as Wales Zone 3/Norway F2 - see return_period above.
      (2) Defences / wave run-up not independently verified for this benchmark's
      methodology - same caution as every other country (Spain §2.1, France §2.2,
      Finland §2.4, Norway §2.3, Wales §2.6). (3) geogunit_ids=[3366] uses the
      same new sub-national masking mechanism introduced for Wales - see that
      entry's known_caveats point (3) for how it was derived/verified. (4) Only
      the present-day Medium layer is wired in; High(~10yr)/Low(~1000yr)/Medium+CC
      (2080 high-emissions) layers exist in the same geodatabase but are not yet
      cataloged - a real, already-identified extension, not a data gap.

# -- New Brunswick (part of CAN) -------------------------------------------------
# GeoNB (New Brunswick open data) coastal+inland flood extent shapefiles,
# downloaded from gnb.ca (see url.txt/read_me.txt), created 2025-03-21, CRS
# EPSG:2953 (NB Stereographic Double), vertical datum CGVD2013. 5 real shapefiles
# exist (PresentDay_1in20year, PresentDay_1in100year, ClimateChange2100_1in20year,
# ClimateChange2100_1in100year, HHWLT_2100_polygon - the last a single dissolved
# tidal-datum polygon with no gridcode/Id, not a hazard layer); only
# PresentDay_1in100year is cataloged here (matches the model's RP100).
#
# `gridcode` investigated 2026-10-01 (pyogrio attribute-only read, all 5 files):
# 274-277 distinct values per file - the standard ArcGIS RasterToPolygon artifact
# (literal source-raster pixel value carried through), NOT a hazard-type/category
# flag. Locally this looks like a continuous depth- or water-surface-elevation-like
# field, but units were NOT confirmed - depth-based comparison is deliberately NOT
# used here (variable: extent only). Schema is just Id/gridcode/geometry - no
# date/source/hazard-type attribute despite the dataset's own readme stating it
# "includes both inland and coastal flood hazard mapping" - coastal vs inland
# CANNOT be separated in this delivery (same limitation class as Denmark/Finland's
# combined-hazard national rasters/layers).
#
# country_iso is "CAN" (New Brunswick has no ISO-3166-1 code of its own) - same
# mechanism as Wales/Scotland: Canada has 15 of its own geogunit_107 sub-units
# (confirmed 2026-10-01 against FLOPROS_NL_geogunit_107.xlsx's ISO column), so the
# plain ISO lookup would wrongly include all of Canada. geogunit_ids=[492] resolved
# by sampling geogunit_107_all.nc's "Geogunits" variable at 4 known New Brunswick
# coordinates (Fredericton/Saint John/Moncton/Cumberland Basin, all -> 492) vs.
# neighbouring provinces (Quebec=501, Nova Scotia=495, PEI=500) - same verification
# method as Wales/Scotland.
#
# Real spot-check already run 2026-10-01 (no new catalog wiring needed for this -
# ad-hoc scripts read the shapefile directly): tile 330 (the only NB-overlapping
# tile with existing local RP100 results at the time) gave CSI=0.22 once windowed
# to NB's real coverage band (most of that tile's bbox is Quebec/Gulf of St
# Lawrence, no benchmark data there at all - unwindowed scoring gives a nonsense
# CSI=0.046/FAR=0.95 purely from that domain mismatch - always window to the
# benchmark's own real coverage, do not trust a tile's raw bbox). A new local run
# of tile 189 (large, 207M px, preprocessing inputs already existed) for the
# user-specified Cumberland Basin/Petitcodiac regions (upper Bay of Fundy) found
# severe under-prediction (CSI~0.002 both regions) - see regions/known_caveats
# below, this is believed to be a real COAST-RP/GTSM boundary-forcing limitation
# specific to Fundy's tidal resonance, not a benchmark or extent-algorithm defect.
new_brunswick_present_day_1in100yr:
  data_type: GeoDataFrame
  driver: vector
  path: NewBrunswick/PresentDay_1in100year.shp
  crs: 2953   # NAD83(CSRS) / New Brunswick Stereographic (NBDS)
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: New Brunswick
    country_iso: CAN   # for benchmark-key discovery only - actual territory masking
    # uses geogunit_ids below, NOT an ISO-string match (see file-header comment).
    geogunit_ids: [492]   # WRI geogunit_107 unit ID for New Brunswick specifically.
    hazard_type: coastal   # real caveat: this source is COMBINED inland+coastal,
    # no attribute exists to split them - see file-header comment and known_caveats.
    return_period: 100   # real value - filename-confirmed ("1in100year"); no separate
    # AEP/methodology documentation found alongside the data to cross-check further.
    variable: extent
    coverage: national
    # No attribute_filter: Id/gridcode/geometry only, gridcode is a RasterToPolygon
    # pixel-value artifact (see file-header comment), not a class to filter on - every
    # row in this file is real benchmark-wet extent.
    regions:
      cumberland_basin: [-64.42, 45.85, -64.22, 46.05]   # user-specified real study
      petitcodiac:      [-64.83, 45.92, -64.42, 46.13]   # area (2026-10-01) - upper
      # Bay of Fundy, both already real-data spot-checked - see file-header comment.
      # Disjoint from each other (two separate estuaries, neither contains the
      # other) - validate_country.py's own _blend_regions sums them for the "ALL"
      # row, same as Spain's mainland/canary_islands. NO whole-province
      # "new_brunswick" region here - deliberately removed 2026-10 (profiled
      # directly: the whole-province bbox's own spatial-index query against this
      # benchmark's 784,805-feature RasterToPolygon shapefile returns 783,560
      # candidates, ~99.8% of the entire file, which made a whole-province
      # validate_country_national_coverage() run hang for 3+ hours in one chunk's
      # own rasterize() call; the SAME benchmark's cumberland_basin/petitcodiac
      # windows pull only 10,504/2,820 candidates and score in single-digit
      # seconds - see each region's own candidate-count profiling in this
      # session's history). The file's own one-time load (~525s for 784,805
      # features, independent of which regions are configured) is a separate,
      # bounded, unavoidable cost of this one benchmark's unusually fragmented
      # source data - NOT fixed by this change, just no longer compounded by a
      # whole-province rasterize that never finished.
    description: >
      GeoNB present-day 1-in-100-year flood extent polygons (combined inland +
      coastal hazard, no split available), covering the New Brunswick coastline
      and major tidal rivers/estuaries.
    methodology: >
      ArcGIS RasterToPolygon conversion of GeoNB's own internal flood hazard raster
      (methodology not independently reviewed here - see known_caveats), created
      2025-03-21.
    source_url: https://www.gnb.ca/en/campaign/geonb/data-catalogue/flood-extent.html
    date_retrieved: "2026-10-01"
    source_license: GeoNB Open Data Licence
    known_caveats: >
      (1) Combined inland+coastal hazard - no attribute separates them (see
      file-header comment); comparisons here include whatever genuinely-coastal
      signal is in the model's own coastal-only RP100 output, so any inland-only
      benchmark flooding is an expected, unavoidable extent mismatch, not a model
      defect. (2) gridcode is a RasterToPolygon pixel-value artifact of unconfirmed
      units - NOT used for depth comparison (variable: extent only), see file-header
      comment. (3) Real spot-check (2026-10-01) found severe under-prediction at the
      Bay of Fundy head (Cumberland Basin/Petitcodiac, CSI~0.002 both) - Fundy has
      the largest tidal range on Earth (~14-16m) via bay-shape/tidal-period
      resonance; COAST-RP's underlying tide-surge model (GTSM) is a documented case
      in the coastal literature for under-resolving this specific resonance at
      typical global grid resolutions - boundary water levels near the Fundy head
      (sampled directly from this tile's own boundaries_RP100_SLR_0.gpkg) cap at
      ~4.77m, implausibly low for a real RP100 extreme water level this far up the
      bay. Believed to be a genuine upstream forcing-data limitation specific to
