# ── Root path ─────────────────────────────────────────────────────────────────
# Separate catalog from data_catalog_gfm.yml (not merged with it) because it
# needs its own `root`. Overridden at load time by validation/validate_country.py via
# config_utils.get_data_catalog(..., root=config["validation"]["benchmark_root"]) -
# the value below is only the checked-in default for this machine.
root: "P:/11212688-004-global-floodmaps/modelling/inputs/validation"

# ──────────────────────────────────────────────────────────────────────────────
# Benchmark flood-hazard-map metadata. Per-country/per-dataset transformation
# rules (attribute_filter, exclude_bbox, wet_values, depth_threshold_m, study_area)
# are read by validation.load_benchmark_spec() from each entry's own `meta` block,
# so adding a new country/dataset is a catalog entry here, not a new
# `if country == ...` branch in code. See docs/methods_04b_MapsValidation.md for
# the full field reference. Australia's own entry is still pending (not downloaded).

spain_arpsi_marina_segments:
  data_type: GeoDataFrame
  driver: vector
  path: ESP/Capa_Nacional_2c_3c_PBC_v4.shp
  crs: 25830
  filesystem: local
  meta:
    category: study_area_source   # not a flood_hazard_benchmark - deliberately no
    # hazard_type set, so validate_country.py's own benchmark discovery
    # (_find_benchmark_keys, which requires meta.hazard_type=="coastal") never
    # picks this up as a benchmark in its own right.
    country: Spain
    description: >
      ARPSI (Spanish: "area con riesgo potencial significativo de inundacion") national
      layer (3,040 line segments/tramos, all ORIGEN_INU types - Marina, Fluvial,
      Pluvial, and mixed combinations). Referenced as spain_zi_marina_q100's own
      study_area.source, filtered there to ORIGEN_INU=="Marina" for the
      coastal-only segments.
    source_url: <to confirm - MITECO ARPSI download portal>
    date_retrieved: "2026-09-29"
    source_license: <to confirm>

spain_zi_marina_q100:
  data_type: GeoDataFrame
  driver: vector
  path: ESP/LAMINAS_Q100_MEDIA_ETRS89.shp
  crs: 4258
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Spain
    country_iso: ESP
    hazard_type: coastal          # coastal | fluvial | mixed - only `coastal` is comparable
    return_period: 100
    variable: extent               # extent | depth
    native_resolution_m: 5         # from PRECISION = "MDT 5x5" (documentation only -
                                    # comparison happens on the model grid, not this)
    # --- transformation rules read by validation.load_benchmark() ---
    attribute_filter: {TIPO_ZONA: "Z.I. PROBABILIDAD MEDIA (100 AÑOS)"}
    # Named sub-regions covering the whole benchmark, scored/reported/plotted
    # separately AND auto-blended into one country-level row by
    # validate_country.py's own _blend_regions (2026-09 - previously the
    # Canary Islands were dropped entirely via exclude_bbox; now scored as
    # their own region instead, for consistency with France's kept-overseas
    # approach).
    regions:
      mainland: [-9.5, 35.0, 4.5, 44.0]          # continental Spain + Balearic Islands
      canary_islands: [-19.0, 27.0, -13.0, 30.0]
    # raster sources instead use: wet_values: [1,2] | depth_threshold_m: 0.1 | nodata: 255
    study_area:                    # official ARPSI study design, not yet consumed by any
      source: spain_arpsi_marina_segments   # code - see docs item 11 ("study-area evaluation
      geometry_type: segments               # domain") for the engine that will read this
      attribute_filter: {ORIGEN_INU: "Marina"}
      # snap_tolerance_m: 250 (default)
    # ---
    description: >
      SNCZI "Zonas Inundables de origen marino" - marine-origin flood zones for the
      Spanish coast, medium probability (100-year return period).
    methodology: >
      Still-water + wave levels from a 60-year C3E hindcast, run-up via IH2VOF
      formulae at profiles spaced 200 m, flooded onto a 5 m LiDAR DTM. 90% band.
    source_url: https://www.miteco.gob.es/es/cartografia-y-sig/ide/descargas/costas-medio-marino/zi-origen-marino.html
    date_retrieved: "2026-09-08"
    source_license: <to confirm - see the MITECO download page>
    source_version: "2016-04-12"   # DBF_DATE_LAST_UPDATE
    known_caveats: >
      Covers only surveyed coastal stretches, NOT the whole coast - see the plan
      doc's §3. Includes wave run-up, which the GFM model does not simulate.

france_tri_perimeters:
  data_type: GeoDataFrame
  driver: vector
  path: FRA/n_tri_s.shp
  crs: 4326
  filesystem: local
  meta:
    category: study_area_source   # not a flood_hazard_benchmark - deliberately no
    # hazard_type set, so validate_country.py's own benchmark discovery
    # (_find_benchmark_keys, which requires meta.hazard_type=="coastal") never
    # picks this up as a benchmark in its own right.
    country: France
    description: >
      TRI ("Territoire à Risque important d'Inondation") perimeters, all 131
      nationally-designated risk territories. Covers BOTH coastal and fluvial
      TRIs (e.g. "Dijonnais", an inland Burgundy TRI, alongside "TRI DE
      MAYOTTE") - no attribute here separates them. Referenced as every France
      benchmark's own study_area.source with no attribute_filter; the
      study-area engine's own coverage filter (not yet implemented - see docs
