norway_stormflo_200ar:
  data_type: GeoDataFrame
  driver: vector
  driver_kwargs: {layer: stormflo200ar_klimaarna}
  path: NOR/stormflo200ar_klimaarna.gpkg
  crs: 25833                     # ETRS89 / UTM zone 33N - projected, unlike Spain (4258) and
                                  # France (4326); build_evaluation_clusters/benchmark_fraction_from_vector
                                  # reproject to the working CRS as needed, no extra handling required.
  filesystem: local
  meta:
    category: flood_hazard_benchmark
    country: Norway
    country_iso: NOR
    hazard_type: coastal
    return_period: 200            # real value ("F2"/TEK17 safety class 2, storm-surge recurring
                                   # ~1/200yr) - Norway has no 100yr layer (only 20/200/1000yr,
                                   # "sikkerhetsklasseflom" F1/F2/F3). Compared against the model's
                                   # RP100 anyway (user decision 2026-09) - a real, documented
                                   # return-period mismatch, same spirit as France's "02Moy" caveat.
    variable: extent
    coverage: national            # Kartverket assessed the ENTIRE Norwegian coastline (unlike
    # Spain/France's isolated designated survey zones) - confirmed via the dump's own
    # dekningsomrade (coverage) table: ikkeRelevant (inland, excluded) + kartlagtUtenFunn
    # (mapped, nothing found - real dry evidence) + grundigKartlagtMedFunn (thoroughly mapped
    # with findings) partition the whole country, no "unsurveyed" gap. Dispatches
    # validate_country.py to validate_country_national_coverage (per-postprocessing-chunk,
    # no buffer/cluster) instead of the cluster-based path - both because "outside the
    # polygon" is unambiguous here (a real dry result, not "never looked at"), and because
    # Norway's long, only-lightly-fragmented coastline collapses build_evaluation_clusters'
    # buffer+merge into one cluster spanning almost the whole country, which crashed the
    # cluster-based path's per-cluster bbox-sized array allocation (confirmed 2026-09: a
    # single cluster with bbox 27deg x 13.5deg triggered a 65.9 GiB allocation).
    # No attribute_filter: this GeoPackage (converted 2026-09 from Kartverket's real 26 GiB
    # PostGIS dump by preparation/convert_norway_stormflo.py) is ALREADY a single-scenario
    # extract - every one of its 115,440 rows has sikkerhetsklasseflom='F2' (confirmed).
    # NOT pre-filtered/subtracted for the sea: each raw polygon is "everything below water
    # level X", which includes the permanently-wet sea (confirmed 2026-09: 97.6-99.3% of raw
    # polygon area at sampled AOIs). This is NOT stripped at conversion time - it relies on
    # this pipeline's EXISTING Copernicus land-use permanent-water exclusion (the same
    # `not_water` masking already applied for Spain/France) instead, confirmed 2026-09 to
    # correctly classify 98.06% of the real sea area as permanent water even across Norway's
    # narrow fjords/island coastline (92.7-99.1% at every one of 5 sampled AOIs, including a
    # narrow fjord and an island maze) - see known_caveats for the corresponding land-side cost.
    regions:
      mainland: [4.0, 57.5, 31.5, 71.5]   # real data bounds (converted GeoPackage):
      # lon 4.28-31.35, lat 57.85-71.31 (Utsira to the Russian border, to North Cape) - no
      # overseas territories.
    description: >
      Kartverket (Norwegian Mapping Authority) official storm-surge hazard polygons,
      "sikkerhetsklasseflom" F2 (TEK17 safety class 2, ~200-year recurrence), scale 1:80,000.
      Source table stormflo200ar_klimaarna ("today's climate", as opposed to the same
      dataset's climaar2100/2150 projection tables, not used here).
    methodology: >
      Kartverket's own storm-surge model output, water level referenced to NN2000 (Norway's
      vertical datum), delineated onto Kartverket's own elevation data. Distributed as a
      PostGIS SQL dump (schema stormflohavniva_*), converted once to this GeoPackage by
      preparation/convert_norway_stormflo.py (not part of the regular Snakemake DAG - run
      manually/on-demand, like analysis/extract_country_population.py).
    source_url: https://kartkatalog.geonorge.no/metadata/stormflo-og-havnivaa/fbb95c67-623f-430a-9fa5-9cfcea8366b3
    date_retrieved: "2026-09-10"
    source_license: NLOD (Norwegian Licence for Open Government Data)
    source_version: "2026-09-06"   # dataset's own last-updated date per the Geonorge API
    known_caveats: >
      (1) Return-period mismatch: F2/~200yr compared against the model's RP100 - looser than
      even France's vague "02Moy", see return_period above. (2) Vertical datum: real measured
      NN2000->GOCO06s offset is -0.196 m mean (-0.334 to -0.006 m across Norway's latitude
      range, via Kartverket's own HREF2018B grid) - given Norway's coastline is steep enough
      that this translates to only ~2 m of horizontal boundary shift (~10 m displacement per
      1 m of water level, measured from Kartverket's own nested hazard layers), this is 7% of
      one DEM pixel and 50x below the vector_simplify_tolerance_m already accepted elsewhere -
      measured and deliberately NOT corrected for, see docs/flood_extent_validation_caveats.md.
      (3) The SAME land-use masking that correctly excludes ~98% of the raw polygon's sea area
      also masks ~51% of the genuine thin land-inundation strip (Norway's actual flooded land
      is only ~0.2-2.1% of the raw polygon to begin with, and a coastal strip that narrow is
      finer than Copernicus' 100 m resolution) - not Norway-specific (measured 97.8% for
      Spain's own most-coastal feature too), but more consequential here given how thin
      Norway's real flood extent is; effective benchmark-wet area is roughly ~1% of raw
      polygon area. (4) Data-quality gap found in Bergen specifically: its four hazard layers
      (mean-high-water/20yr/200yr/1000yr) have inconsistent feature counts (24/34/57/47) and
      are not cleanly nested - real disagreement in Kartverket's own source data, unrelated to
      anything this pipeline does, large enough to dominate the datum signal there.
