# Global-deltas flood hazard maps, ssp245, RP100, all 5 SLR levels. Sibling of deltas_ssp126.yml
# (see its header); builds its own isolated WL_scenarios.

tile_grid:
  path: "{processed_inputs_dir}/mask/deltas_global_tiles.gpkg"

simulation:
  flooding:
    friction_scale_factor: 9.0  # computed with 9.0 (config.yml: 12.0)
  model_outputs: "{root}/deltas_floodmaps/ssp245/model_outputs"

postprocessing:
  merged_outputs: "{root}/deltas_floodmaps/ssp245/merged_results"

visualization:
  output_dir: "{root}/deltas_floodmaps/ssp245/figures"

boundary_conditions:
  slr_projection: "ssp245"
  waterlevel_nc_dir: "{root}/deltas_floodmaps/ssp245/WL_scenarios"
  return_periods: [100]

adaptation:
  slr_intensities: []

# --calibration, not --fuse (multiple hop_distance waves); see deltas_ssp126.yml.
hpc:
  n_nodes: 8
  jobs_dir: "{root}/deltas_floodmaps/ssp245/model_outputs/hpc_jobs"
