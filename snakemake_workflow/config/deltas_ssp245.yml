# Global-deltas flood hazard maps, ssp245, RP100, all 5 SLR levels. Sibling of deltas_ssp126.yml
# (see its header); builds its own isolated WL_scenarios.

tile_grid:
  path: "{processed_inputs_dir}/mask/deltas_global_tiles.gpkg"

simulation:
  model_outputs: "{root}/deltas_floodmaps/ssp245/model_outputs"
  preprocessing_inputs_dir: null  # own per-tile inputs under model_outputs

postprocessing:
  merged_outputs: "{root}/deltas_floodmaps/ssp245/merged_results"

visualization:
  output_dir: "{root}/deltas_floodmaps/ssp245/figures"
  growth_rates: {max: 1.5, min: -0.5}
  slr_interp: {max_mm: 1500, n_points: 100}

boundary_conditions:
  slr_projection: "ssp245"
  waterlevel_nc_dir: "{root}/deltas_floodmaps/ssp245/WL_scenarios"
  # Own station caches: the shared {processed_inputs_dir}/WL_scenarios_cache holds production's
  # levels under the same file names.
  stations_cache_dir: "{root}/deltas_floodmaps/ssp245/WL_scenarios_cache"
  return_periods: [100]

adaptation:
  slr_intensities: []

# --calibration, not --fuse (multiple hop_distance waves); see deltas_ssp126.yml.
hpc:
  n_nodes: 8
  jobs_dir: "{root}/deltas_floodmaps/ssp245/model_outputs/hpc_jobs"

# Deliverable scope (figures and the population years reported).
analysis: {plot_timeseries: true}
population_growth:
  output_years: [2025, 2030, 2035, 2040, 2045, 2050, 2060, 2075, 2100]
