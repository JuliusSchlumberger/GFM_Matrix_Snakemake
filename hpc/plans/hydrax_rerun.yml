# Hydrax rerun under one 144-core budget: storm-tide product -> production inputs -> eikonal solver
# studies (500 tiles, land cover and uniform) and SFINCS calibration (1,500 tiles, both groups, two
# phases) -> decision: solver caps and flood model -> validation runs (England all, Wales Severn,
# SF Bay; local input on fine tiles, global input on production tiles; base and variants; hop test)
# and their scores -> decision: production -> production run with postprocessing, exposure and
# flood totals, which keeps the global-input runs' tile results.
# Step order is also release priority. Steps marked destructive delete old outputs on <data_root>;
# they run only with --allow-destructive. A gate step stops the run until
# `python hpc/harness.py mark-done --plan hpc/plans/hydrax_rerun.yml <gate>`. Run the harness with
# the gfm env's python.
#   python hpc/harness.py run --plan hpc/plans/hydrax_rerun.yml --allow-destructive
# The eikonal solver studies alone (with the product rebuild they read):
#   python hpc/harness.py run --plan hpc/plans/hydrax_rerun.yml --allow-destructive --only product,materialize,reset_studies,studies_preprocess,sweep_landcover,sweep_uniform,wet_tiles,obstacle_coupling,study_figures
name: hydrax_rerun
max_cores: 144
partition_cores: {}
state_dir: /p/11212688-004-global-floodmaps/modelling/hpc_harness/hydrax_rerun
cwd: /u/schlumbe/gfm_code
# Gitignored site files (docs/hpc.md, "Site setup").
requires: [snakemake_workflow/config/config_hpc.yml, snakemake_workflow/config/config_local.yml]
env:
  HDF5_USE_FILE_LOCKING: "FALSE"
preamble: |
  PY="$GFM_HARNESS_PYTHON"
  gfm_hpc() { "$PY" hpc/gfm_hpc.py "$@"; }
  R=$(gfm_hpc config production --hpc --key paths.root)
  # Local input on fine tiles, own folders; global input on production tiles, results in production's.
  LOCAL_SCENARIOS="england_local_input wales_local_input sf_bay_local_input england_hop_test"
  GLOBAL_SCENARIOS="england_global_input wales_global_input sf_bay_global_input"
  VARIANT_SCENARIOS="england_local_input england_global_input wales_local_input wales_global_input
    sf_bay_local_input sf_bay_global_input"
  # SFINCS post job: the analysis and the owned-area rescoring of every run on 1,500 tiles:
  # 16 workers, 2-day limit.
  SFINCS_POST="--profile-set sfincs_post.partition=16vcpu --profile-set sfincs_post.cpus_per_task=16
    --profile-set sfincs_post.mem=120G --profile-set sfincs_post.time=2-00:00:00"

steps:
  # ── storm-tide product (2026-11-08 decisions, basin shifts fitted in the build) ──
  - id: product
    run: gfm_hpc product --submit

  - id: materialize
    after: [product]
    run: |
      "$PY" snakemake_workflow/scripts/materialize_configs.py

  # ── production tile inputs (SFINCS reads them; the global run simulates them) ──
  # After studies_preprocess: both build the shared stations_RP100_SLR_0 cache.
  - id: production_preprocess
    after: [materialize, studies_preprocess]
    run: gfm_hpc run preprocess --scenario production --preprocess-only --submit

  # ── eikonal solver studies, 500 tiles, per friction source ──
  - id: reset_studies
    destructive: true
    run: |
      cd "$R/calibration_500_tiles"
      rm -rf sweep_budget obstacle_coupling sweep_budget_landcover sweep_budget_uniform \
             obstacle_coupling_landcover obstacle_coupling_uniform
      rm -rf "$R/figures/500_tiles"
      rm -f hpc_jobs/calib_*.sbatch hpc_jobs/submit_calib_*.sh hpc_jobs/logs/calib_*

  - id: studies_preprocess
    after: [materialize]
    run: gfm_hpc run preprocess --scenario calibration_500_tiles --preprocess-only --submit

  - id: sweep_landcover
    after: [studies_preprocess, reset_studies]
    run: gfm_hpc studies sweep --source landcover --submit

  - id: sweep_uniform
    after: [studies_preprocess, reset_studies]
    run: gfm_hpc studies sweep --source uniform --submit

  # The sweep's jobs end with the step, so the wet-tile lists are written here, after them.
  - id: wet_tiles
    after: [sweep_landcover, sweep_uniform]
    run: gfm_hpc studies wet-tiles --source landcover uniform

  - id: obstacle_coupling
    after: [wet_tiles]
    run: gfm_hpc studies obstacle --source landcover uniform --submit

  # Per friction source; a source's caps also serve its duration variant.
  - id: study_figures
    after: [obstacle_coupling]
    run: gfm_hpc studies figures --source landcover uniform --submit

  # ── SFINCS calibration, 1,500 tiles: stage 1 -> selection -> sweep (+ post job) -> duration ──
  # Also removes both variant_selection.json files, so nothing downstream can read an old selection.
  - id: reset_sfincs
    destructive: true
    run: |
      rm -rf "$R/calibration_roughness_SFINCS" "$R/calibration_roughness_SFINCS_dedup"
      rm -rf "$R/figures/sfincs_runs/calibration_roughness_SFINCS" "$R/figures/sfincs_runs/calibration_roughness_SFINCS_dedup"

  - id: sfincs_sweep
    after: [production_preprocess, reset_sfincs]
    run: gfm_hpc sfincs stage1 --n-tiles 1500 $SFINCS_POST --submit

  - id: sfincs_duration
    after: [sfincs_sweep]
    run: |
      "$PY" sfincs_tiles/calibration_split.py --config "$R/calibration_roughness_SFINCS/resolved_config.yml" \
        || echo "WARNING: calibration_split.py failed (balance report only; the duration phase does not read it)"
      gfm_hpc sfincs rerun --part models --phase duration $SFINCS_POST --submit

  # ── decision: solver caps and flood model, from the studies and the SFINCS calibration ──
  - id: choose_parameters
    after: [study_figures, sfincs_duration]
    gate: >-
      set simulation.flooding in config.yml: max_rounds and obstacle_coupling.max_outer_iterations
      per friction source (figures_root/500_tiles/<source>) and the best flood-model variant
      (calibration_roughness_SFINCS_dedup/variant_selection.json); commit, push and git pull here
      (TODO.md, flood-model comparison steps 2 and 6).

  - id: rematerialize
    after: [choose_parameters]
    run: |
      "$PY" snakemake_workflow/scripts/materialize_configs.py

  # ── production outputs: cleared once, then filled by the global-input runs and the production run ──
  # run_eikonal_cli skips an existing output, so old results would otherwise count as done. The per-tile
  # inputs stay (production_preprocess rebuilt them).
  - id: reset_production
    after: [choose_parameters]
    destructive: true
    run: |
      MO=$(gfm_hpc config production --hpc --key simulation.model_outputs)
      MERGED=$(gfm_hpc config production --hpc --key postprocessing.merged_outputs)
      cd "${MO:?}"
      rm -rf ./*/results oom_tiles skipped_tiles run_timings hpc_jobs
      rm -rf "${MERGED:?}"

  # ── validation runs: local input (fine tiles) and global input (production tiles) ──
  - id: reset_local
    destructive: true
    run: |
      for s in wales_local_input wales_global_input sf_bay_local_input sf_bay_global_input england_hop_test; do
        rm -rf "$R/$s/model_outputs"/*/results "$R/$s/model_outputs"/{oom_tiles,skipped_tiles,run_timings}                "$R/$s/merged_results" "$R/$s/validation" "$R/$s/model_outputs/hpc_jobs" "$R/$s/hpc_jobs"
      done

  - id: local_station_caches
    after: [materialize]
    job: {partition: 4vcpu, cpus_per_task: 4, mem: 30G, time: "1-00:00:00"}
    run: |
      for s in england_local_input england_hop_test; do
        "$PY" preparation/cache_local_waterlevel_stations.py --config "$(gfm_hpc config $s --hpc)"
      done
      "$PY" preparation/cache_local_waterlevel_stations.py --config "$(gfm_hpc config wales_local_input --hpc)"           --local-dem-key wales_lidar_dem

  # The production tiles under each local scenario's fine tiles, closed over hop seeding.
  - id: global_tiles
    after: [materialize]
    run: |
      for c in england wales sf_bay; do
        FINE=$(gfm_hpc config ${c}_local_input --hpc --key tile_grid.path)
        "$PY" preparation/select_country_tiles.py --config "$(gfm_hpc config production --hpc)"           --footprint "$FINE" --name ${c}_global_input --out-dir "$(dirname "$FINE")"
      done

  - id: local_runs
    # After production_preprocess: SF Bay's global forcing reads the station cache it builds.
    after: [rematerialize, local_station_caches, reset_local, production_preprocess]
    run: |
      for s in $LOCAL_SCENARIOS; do
        gfm_hpc run preprocess --scenario $s --submit
      done

  # Their tile results stay in production's model_outputs; the production run skips them.
  - id: global_runs
    after: [rematerialize, reset_production, reset_local, global_tiles, production_preprocess]
    run: |
      for s in $GLOBAL_SCENARIOS; do
        gfm_hpc run preprocess --scenario $s --submit
      done

  # Validation batches (each scenario's validation.runs), in parallel once their runs are merged.
  - id: validate_england_local
    after: [local_runs]
    run: gfm_hpc validate --scenario england_local_input --only scores --submit

  - id: validate_england_global
    after: [global_runs]
    run: gfm_hpc validate --scenario england_global_input --submit

  - id: validate_england_map
    after: [local_runs, global_runs]
    run: gfm_hpc validate --scenario england_local_input --only agreement_map --submit

  - id: validate_wales
    after: [local_runs, global_runs]
    run: gfm_hpc validate --scenario wales_local_input --submit

  - id: validate_sf_bay
    after: [local_runs]
    run: gfm_hpc validate --scenario sf_bay_local_input --submit

  - id: validate_sf_bay_global
    after: [global_runs]
    run: gfm_hpc validate --scenario sf_bay_global_input --submit

  # Local vs global input, area- and population-weighted (T4).
  - id: exposure_table
    after: [validate_england_local, validate_england_global, validate_wales]
    run: gfm_hpc validate --scenario england_local_input --only exposure_table

  # ── validation runs with every flood-model variant at its calibrated run ──
  # Every variant at the run the SFINCS calibration selected for it (variant_selection.json).
  - id: local_variants
    after: [rematerialize, local_runs, global_runs]
    run: |
      SEL="$R/calibration_roughness_SFINCS_dedup/variant_selection.json"  # each place scored once
      "$PY" snakemake_workflow/scripts/materialize_configs.py $VARIANT_SCENARIOS --variants all --selection "$SEL"
      for f in snakemake_workflow/config/*__*_materialized.yml; do
        gfm_hpc run preprocess --config "$f" --submit
      done

  # ── production: full grid, every RP x SLR, then postprocessing, exposure and flood totals ──
  - id: approve_production
    after: [exposure_table, validate_england_map, validate_sf_bay, validate_sf_bay_global, local_variants]
    gate: >-
      review the validation scores (local vs global input, every variant); production runs with
      config.yml as it stands now, so leave simulation.flooding as the global-input runs had it.

  - id: production_run
    after: [approve_production]
    run: gfm_hpc run preprocess --scenario production --submit
